<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>调查员助手 · TRPG Toolkit</title>
<style>
/* ============================================================
   调查员助手 · 设计系统
   依据：暗色模式最佳实践（避免纯黑背景 / 靠明度分层 / 强调色去饱和
   / 正文对比度 ≥ 4.5:1）、数据密集型界面的 8px 间距基数与字号层级、
   多步向导的进度可见性与逐步校验原则。
   ============================================================ */

:root {
  /* —— 背景层级：深色模式下用明度表达 elevation，而非阴影 —— */
  --bg-base:    #121212;
  --bg-surface: #191919;
  --bg-raised:  #212121;
  --bg-overlay: #2a2a2a;
  --bg-inset:   #0d0d0d;

  /* —— 文字：不使用纯白，避免光晕（halation）—— */
  --text-1: #e9e7e4;   /* 正文，对 #121212 约 14:1 */
  --text-2: #a9a6a1;   /* 次要，约 7.6:1 */
  --text-3: #8b8882;   /* 提示，三种底色上均 ≥4.5:1（普通文字 AA）；仍明显弱于 --text-2 的 7.6:1 */

  /* —— 边框与分隔 —— */
  --line-1: #262626;
  --line-2: #343434;
  --line-3: #474747;

  /* —— 强调色：去饱和墨绿，贴合 1920 年代氛围 —— */
  --accent:      #7fae93;
  --accent-hi:   #9cc9ae;
  --accent-bg:   #1b2a23;
  --accent-line: #35513f;

  /* —— 语义色：深色底上提亮以保对比度，且不单独承担信息 —— */
  --danger:      #d9877a;
  --danger-bg:   #2c1d1a;
  --danger-line: #5c3630;
  --warn:        #d9b268;
  --warn-bg:     #2b2417;
  --warn-line:   #5c4a2a;
  --info:        #86a9c9;
  --info-bg:     #1b2530;
  --info-line:   #34485c;
  --brass:       #c9a961;

  /* —— 间距：8px 基数 —— */
  --s1: 4px;  --s2: 8px;  --s3: 12px; --s4: 16px;
  --s5: 24px; --s6: 32px; --s7: 48px; --s8: 64px;

  /* —— 圆角 —— */
  --r1: 4px; --r2: 6px; --r3: 10px; --r4: 14px; --r-pill: 999px;

  /* —— 字体 —— */
  --font-sans: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  --font-serif: Georgia, "Times New Roman", "Songti SC", SimSun, serif;
  --font-mono: "Cascadia Code", Consolas, "SF Mono", Menlo, monospace;

  --lh-tight: 1.3;
  --lh-body: 1.6;
}

/* ============================================================
 * 主题：只覆盖**强调色四件套**，其余令牌共用（深浅、层级、语义色都不动）。
 *
 * 可选主题为什么只有两套（默认墨绿 + 紫罗兰、绯）——
 * `--danger`（红 ≈10°）/ `--warn`（黄 ≈40°）/ `--info`（蓝 ≈209°）已经占住色轮三块，
 * 而本工具那条约定「**有颜色的块 = 选中**」要求强调色与语义色**一眼分得开**。
 * 实测（色相距离，见 CHANGELOG 第五十批的算法）：
 *   · 青碧 186° → 离 info 仅 23°；靛蓝 195° → 仅 15°（等于同色）  ⇒ 蓝家整片不能用
 *   · 黄铜 #c9a961 41.5° → 离 warn 仅 2°（本来就是同色系）        ⇒ 黄家不能用
 *   · 血红 10° → 就是 danger 本身                                  ⇒ 红家不能用
 * 剩下能用的安全区只有三个：**绿 145° / 紫 270° / 品红 332°**。
 *
 * 新增主题前请先算「对比度（accent-hi 压 accent-bg ≥4.5）＋色相距离（与三个语义色 ≥30°）」，
 * 别凭眼睛挑 —— 配色凭感觉做不会报错，只会静默地不可读或语义混淆。
 * ============================================================ */

[data-theme="violet"] {
  --accent:      #9d8cc4;
  --accent-hi:   #bdafe0;
  --accent-bg:   #231e30;
  --accent-line: #453c5c;
}

[data-theme="rose"] {
  --accent:      #c98ca8;
  --accent-hi:   #e3b6cc;
  --accent-bg:   #2b1f26;
  --accent-line: #563c49;
}

/* 设置页里那个颜色预览圆点（颜色由 JS 内联 style 给，取自 `theme.js` 的 swatch） */
.theme-dot {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  margin-right: var(--s2);
  vertical-align: middle;
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--bg-base);
  color: var(--text-1);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: var(--lh-body);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 { margin: 0; font-weight: 500; line-height: var(--lh-tight); }
p { margin: 0; }

/* 可见的键盘焦点环 —— 暗色下默认焦点环几乎不可见 */
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--r1);
}

/* ============================ 外壳布局 ============================ */

#app {
  display: grid;
  grid-template-columns: 228px minmax(0, 1fr);
  grid-template-rows: 60px minmax(0, 1fr);
  grid-template-areas:
    "topbar topbar"
    "sidebar viewport";
  height: 100vh;
}

.topbar {
  grid-area: topbar;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s4);
  padding: 0 var(--s5);
  background: var(--bg-surface);
  border-bottom: 1px solid var(--line-1);
}

.brand { display: flex; align-items: center; gap: var(--s3); }

.brand-mark {
  width: 26px; height: 26px;
  border: 1px solid var(--accent-line);
  border-radius: 50%;
  background: radial-gradient(circle at 50% 45%, var(--accent-bg) 0%, transparent 70%);
  position: relative;
  flex: none;
}
.brand-mark::after {
  content: "";
  position: absolute; inset: 8px;
  border-radius: 50%;
  border: 1px solid var(--accent);
  opacity: .75;
}

.brand-text h1 {
  font-family: var(--font-serif);
  font-size: 16px;
  letter-spacing: .04em;
}
.brand-text p {
  font-size: 11px;
  color: var(--text-3);
  letter-spacing: .16em;
  text-transform: uppercase;
}

/* 顶栏右侧是固定内容：不许被左侧品牌挤压缩窄（否则「规则系统」会折成两行） */
.topbar-actions { display: flex; align-items: center; gap: var(--s3); flex: none; }

.rulepack-picker { display: flex; align-items: center; gap: var(--s2); }

/* —— 顶栏状态位（保存状态 / 当前角色）：内容为空时不占位 —— */
.topbar-slot:empty { display: none; }

.save-chip {
  display: inline-flex;
  align-items: center;
  font-size: 12px;
  line-height: 1;
  color: var(--text-3);
  border: 1px solid transparent;
  border-radius: var(--r-pill);
  padding: 5px 9px;
  white-space: nowrap;
}
/* 可点的那种（保存失败 / 仅内存模式）要有「可以点」的样子 */
button.save-chip { cursor: pointer; border-color: var(--line-2); color: var(--text-2); }
button.save-chip:hover { border-color: var(--accent-line); color: var(--text-1); }
.save-chip.is-busy { color: var(--text-3); }
.save-chip.is-bad { color: var(--danger); border-color: var(--danger-line); }
button.save-chip.is-bad:hover { border-color: var(--danger); color: var(--danger); }

/* —— 顶栏：当前角色 chip（「我在给谁记账」）—— */
.char-chip {
  display: inline-flex;
  align-items: baseline;
  gap: var(--s2);
  max-width: 260px;
  padding: 4px 10px;
  border: 1px solid var(--line-2);
  border-radius: var(--r-pill);
  background: var(--bg-raised);
  cursor: pointer;
}
.char-chip:hover { border-color: var(--accent-line); }
.char-chip-name {
  font-size: 13px;
  color: var(--text-1);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.char-chip-stats { font-size: 11px; color: var(--text-3); white-space: nowrap; }
.rp-label {
  font-size: 12px;
  color: var(--text-2);
  white-space: nowrap;   /* 中文标签一旦允许换行，会断成「规则系 / 统」 */
  flex: none;
}
#rulepack-select { min-width: 168px; }

/* ============================ 侧栏导航 ============================ */

.sidebar {
  grid-area: sidebar;
  background: var(--bg-surface);
  border-right: 1px solid var(--line-1);
  padding: var(--s4) var(--s3);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.nav-group-label {
  font-size: 11px;
  color: var(--text-3);
  letter-spacing: .12em;
  padding: var(--s4) var(--s3) var(--s2);
}
.nav-group-label:first-child { padding-top: var(--s1); }

.nav-item {
  display: flex;
  align-items: center;
  gap: var(--s3);
  width: 100%;
  min-height: 40px;
  padding: var(--s2) var(--s3);
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--r2);
  color: var(--text-2);
  font-family: inherit;
  font-size: 14px;
  text-align: left;
  cursor: pointer;
  transition: background-color .15s ease, color .15s ease;
}
.nav-item:hover { background: var(--bg-raised); color: var(--text-1); }
.nav-item[aria-current="page"] {
  background: var(--accent-bg);
  border-color: var(--accent-line);
  color: var(--accent-hi);
}

/* 图标跟随文字颜色 —— 悬停与选中态自动同步 */
.nav-icon {
  width: 16px;
  height: 16px;
  flex: none;
  display: grid;
  place-items: center;
  color: var(--text-3);
  transition: color .15s ease;
}
.nav-item:hover .nav-icon { color: var(--text-2); }
.nav-item[aria-current="page"] .nav-icon { color: var(--accent); }

.nav-label {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.nav-count {
  font-size: 11px;
  font-family: var(--font-mono);
  color: var(--text-3);
}

/* 低频项与常用项之间的分隔 */
.nav-divider {
  margin: var(--s4) 0 var(--s2);
  padding-top: var(--s3);
  border-top: 1px solid var(--line-1);
}

/* ============================ 主视口 ============================ */

.viewport {
  grid-area: viewport;
  overflow-y: auto;
  padding: var(--s6) var(--s7) var(--s8);
}

.view-head { margin-bottom: var(--s5); }
.view-head h2 {
  font-family: var(--font-serif);
  font-size: 24px;
  letter-spacing: .02em;
}
.view-head p {
  color: var(--text-2);
  font-size: 13px;
  margin-top: var(--s2);
  max-width: 68ch;
}

.section { margin-bottom: var(--s6); }
.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--s4);
  margin-bottom: var(--s3);
}
.section-head h3 { font-size: 16px; }
.section-head .hint { font-size: 12px; color: var(--text-3); }

/* ============================ 卡片 ============================ */

.card {
  background: var(--bg-surface);
  border: 1px solid var(--line-1);
  border-radius: var(--r3);
  padding: var(--s4) var(--s5);
}
.card + .card { margin-top: var(--s4); }

.card-title {
  font-size: 13px;
  color: var(--text-2);
  margin-bottom: var(--s3);
  letter-spacing: .02em;
}

.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s4); }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s4); }
.grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s3); }

/* ============================ 表单 ============================ */

label.field { display: block; margin-bottom: var(--s4); }
.field-label {
  display: block;
  font-size: 12px;
  color: var(--text-2);
  margin-bottom: var(--s2);
}
.field-help {
  /* 11px 太挤：它承载的是操作说明（有行动意义），不是装饰元数据 */
  font-size: 12.5px;
  color: var(--text-3);
  margin-top: var(--s1);
  line-height: 1.5;
}
.field-error {
  font-size: 12px;
  color: var(--danger);
  margin-top: var(--s1);
  display: flex;
  align-items: center;
  gap: var(--s1);
}
.field-error::before { content: "!"; font-weight: 500; }

input[type="text"], input[type="number"], select, textarea {
  width: 100%;
  padding: var(--s2) var(--s3);
  background: var(--bg-inset);
  border: 1px solid var(--line-2);
  border-radius: var(--r2);
  color: var(--text-1);
  font-family: inherit;
  font-size: 13px;
  line-height: 1.5;
  transition: border-color .15s ease;
}
input[type="number"] { font-family: var(--font-mono); }
input:hover, select:hover, textarea:hover { border-color: var(--line-3); }
input:focus, select:focus, textarea:focus {
  border-color: var(--accent-line);
  outline: none;
}
input[aria-invalid="true"], select[aria-invalid="true"] {
  border-color: var(--danger-line);
}
input::placeholder, textarea::placeholder { color: var(--text-3); }
textarea { resize: vertical; min-height: 72px; }

select {
  appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--text-2) 50%),
                    linear-gradient(135deg, var(--text-2) 50%, transparent 50%);
  background-position: calc(100% - 16px) calc(50% + 1px), calc(100% - 11px) calc(50% + 1px);
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  padding-right: var(--s6);
}

.checkbox-row {
  display: flex;
  align-items: center;
  gap: var(--s2);
  font-size: 13px;
  color: var(--text-2);
  cursor: pointer;
}
input[type="checkbox"] { accent-color: var(--accent); width: 15px; height: 15px; }

/* ============================ 按钮 ============================ */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--s2);
  padding: var(--s2) var(--s4);
  min-height: 34px;
  background: var(--bg-raised);
  border: 1px solid var(--line-2);
  border-radius: var(--r2);
  color: var(--text-1);
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
  transition: background-color .15s ease, border-color .15s ease;
}
.btn:hover { background: var(--bg-overlay); border-color: var(--line-3); }
.btn:disabled { opacity: .4; cursor: not-allowed; }

.btn-primary {
  background: var(--accent-bg);
  border-color: var(--accent-line);
  color: var(--accent-hi);
}
.btn-primary:hover { background: #22392e; border-color: var(--accent); }
.btn-primary:disabled { background: var(--bg-raised); border-color: var(--line-1); color: var(--text-3); }

.btn-danger { color: var(--danger); border-color: var(--danger-line); background: var(--danger-bg); }
.btn-danger:hover { background: #3a2622; }

.btn-ghost { background: transparent; border-color: var(--line-1); color: var(--text-2); }
.btn-ghost:hover { background: var(--bg-raised); color: var(--text-1); }

.btn-sm { min-height: 26px; padding: var(--s1) var(--s3); font-size: 12px; }
.btn-block { width: 100%; display: block; }

.btn-row { display: flex; gap: var(--s3); align-items: center; flex-wrap: wrap; }
.btn-row .spacer { flex: 1; }

/* ============================ 数值展示 ============================ */

.stat {
  background: var(--bg-raised);
  border: 1px solid var(--line-1);
  border-radius: var(--r2);
  padding: var(--s3);
  text-align: center;
}
.stat-label {
  font-size: 11px;
  color: var(--text-3);
  letter-spacing: .06em;
  display: block;
  margin-bottom: var(--s1);
}
.stat-value {
  font-family: var(--font-mono);
  font-size: 22px;
  font-weight: 500;
  color: var(--text-1);
  line-height: 1.2;
}
.stat-value.accent { color: var(--brass); }
.stat-value.danger { color: var(--danger); }
.stat-sub {
  font-size: 11px;
  color: var(--text-3);
  font-family: var(--font-mono);
}

/* 属性格：大值 + 半值 / 五分之一值 */
.char-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s3); }

.char-cell {
  background: var(--bg-raised);
  border: 1px solid var(--line-1);
  border-radius: var(--r2);
  padding: var(--s3);
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: var(--s2) var(--s3);
}
.char-name {
  font-size: 12px;
  color: var(--text-2);
  letter-spacing: .04em;
}
.char-abbr {
  font-size: 10px;
  color: var(--text-3);
  font-family: var(--font-mono);
  letter-spacing: .08em;
}
.char-main {
  font-family: var(--font-mono);
  font-size: 24px;
  color: var(--brass);
  text-align: right;
  line-height: 1;
}

/* 属性格里可直接编辑的数值：黄铜色 + 等宽，与只读展示视觉一致 */
.char-main-input {
  width: 82px;
  padding: 2px 6px;
  text-align: right;
  font-family: var(--font-mono);
  font-size: 22px;
  line-height: 1.1;
  color: var(--brass);
  background: var(--bg-inset);
  border: 1px solid var(--line-2);
  border-radius: var(--r1);
}
.char-main-input:hover { border-color: var(--line-3); }
.char-main-input:focus { border-color: var(--accent-line); outline: none; }
.char-derived {
  grid-column: 1 / -1;
  display: flex;
  gap: var(--s2);
  font-size: 11px;
  font-family: var(--font-mono);
  color: var(--text-3);
}
.char-derived span { display: flex; gap: 3px; }
.char-derived b { color: var(--text-2); font-weight: 400; }

/* ============================ 表格 ============================ */

.table-wrap {
  border: 1px solid var(--line-1);
  border-radius: var(--r3);
  overflow: hidden;
}
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th {
  background: var(--bg-raised);
  color: var(--text-2);
  font-weight: 500;
  font-size: 11px;
  letter-spacing: .06em;
  text-align: left;
  padding: var(--s3) var(--s3);
  border-bottom: 1px solid var(--line-2);
  white-space: nowrap;
}
tbody td {
  padding: var(--s2) var(--s3);
  border-bottom: 1px solid var(--line-1);
  vertical-align: middle;
}
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: var(--bg-surface); }
td.num, th.num { text-align: right; font-family: var(--font-mono); }
td.mid, th.mid { text-align: center; }

.skill-input {
  width: 64px;
  padding: 3px var(--s2);
  text-align: right;
}

/* ============================ 徽章与标记 ============================ */

.badge {
  display: inline-flex;
  align-items: center;
  gap: var(--s1);
  padding: 2px var(--s2);
  border-radius: var(--r1);
  font-size: 11px;
  border: 1px solid var(--line-2);
  color: var(--text-2);
  background: var(--bg-raised);
  white-space: nowrap;
}
.badge-accent { background: var(--accent-bg); border-color: var(--accent-line); color: var(--accent-hi); }
.badge-danger { background: var(--danger-bg); border-color: var(--danger-line); color: var(--danger); }
.badge-warn   { background: var(--warn-bg);   border-color: var(--warn-line);   color: var(--warn); }
.badge-info   { background: var(--info-bg);   border-color: var(--info-line);   color: var(--info); }

/* —— 装备芯片：角色卡上登记的武器 —— */
.gear-chip-list { display: flex; flex-wrap: wrap; gap: var(--s2); }
.gear-chip {
  display: inline-flex;
  align-items: center;
  gap: var(--s1);
  padding: 2px var(--s2) 2px var(--s3);
  border: 1px solid var(--line-2);
  border-radius: var(--r-pill);
  background: var(--bg-raised);
  color: var(--text-1);
  font-size: 12px;
  white-space: nowrap;
}
.gear-chip-x {
  border: 0;
  background: transparent;
  color: var(--text-3);
  cursor: pointer;
  font-size: 14px;
  line-height: 1;
  padding: 0 3px;
  border-radius: 50%;
}
.gear-chip-x:hover { color: var(--danger); background: var(--danger-bg); }

/* ============================ 资源条（可拖动） ============================
   用原生 input[type=range]，轨道只有 6px 高但命中区给到 16px —— 细条也要好点。
   填充宽度走 --pct 自定义属性，拖动时由 JS 就地更新，不必重绘整块面板。 */
.stat-range {
  -webkit-appearance: none;
  appearance: none;
  display: block;
  width: 100%;
  height: 16px;
  margin: 0;
  background: transparent;
  cursor: pointer;
}
/* 余量分档：绿（充裕）/ 黄（偏低）/ 红（危险）。
   这是显示约定，不是规则阈值 —— 规则里与血量相关的阈值只有「单次伤害达上限一半即重伤」。
   三档各自都有对应文字（数值就在条上方），不单靠颜色表意。 */
.stat-range::-webkit-slider-runnable-track {
  height: 6px;
  border-radius: var(--r-pill);
  border: 1px solid var(--line-1);
  background: linear-gradient(
    to right,
    var(--accent) 0 var(--pct, 0%),
    var(--bg-inset) var(--pct, 0%) 100%
  );
}
.stat-range[data-threat="high"]::-webkit-slider-runnable-track {
  background: linear-gradient(
    to right,
    var(--warn) 0 var(--pct, 0%),
    var(--bg-inset) var(--pct, 0%) 100%
  );
}
.stat-range[data-threat="critical"]::-webkit-slider-runnable-track {
  background: linear-gradient(
    to right,
    var(--danger) 0 var(--pct, 0%),
    var(--bg-inset) var(--pct, 0%) 100%
  );
}
/* 不参与分档的池子（魔法值、幸运）：一律灰蓝 ——
   若沿用绿色，会被误读成「状态良好」，与绿/黄/红这套余量语言打架 */
.stat-range[data-threat="neutral"]::-webkit-slider-runnable-track {
  background: linear-gradient(
    to right,
    var(--info) 0 var(--pct, 0%),
    var(--bg-inset) var(--pct, 0%) 100%
  );
}
.stat-range::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 14px;
  height: 14px;
  margin-top: -5px;               /* (16 − 6) / 2 的视觉居中 */
  border-radius: 50%;
  background: var(--text-2);
  border: 1px solid var(--line-3);
  transition: background .15s ease, border-color .15s ease;
}
.stat-range:hover::-webkit-slider-thumb { background: var(--accent); border-color: var(--accent-line); }
.stat-range:active::-webkit-slider-thumb { background: var(--accent-hi); }
.stat-range:focus-visible { outline: none; }
.stat-range:focus-visible::-webkit-slider-thumb {
  background: var(--accent-hi);
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-bg);
}
/* 危险档位：滑块也随档位变色，便于在细条上快速定位 */
.stat-range[data-threat="high"]::-webkit-slider-thumb { background: var(--warn); border-color: var(--warn-line); }
.stat-range[data-threat="critical"]::-webkit-slider-thumb { background: var(--danger); border-color: var(--danger-line); }
.stat-range::-moz-range-track {
  height: 6px; border-radius: var(--r-pill); background: var(--bg-inset); border: 1px solid var(--line-1);
}
.stat-range::-moz-range-thumb {
  width: 13px; height: 13px; border-radius: 50%; background: var(--text-2); border: 1px solid var(--line-3);
}
.stat-range[data-threat="high"]::-moz-range-thumb { background: var(--warn); border-color: var(--warn-line); }
.stat-range[data-threat="critical"]::-moz-range-thumb { background: var(--danger); border-color: var(--danger-line); }

/* 成功等级配色：不靠颜色单独表意，始终伴随文字 */
.lv-fumble  { color: var(--danger); }
.lv-fail    { color: var(--danger); }
.lv-regular { color: var(--warn); }
.lv-hard    { color: var(--info); }
.lv-extreme { color: var(--accent-hi); }
.lv-critical{ color: var(--accent-hi); }

/* ============================ 步骤条（向导进度） ============================ */

.stepper {
  display: flex;
  gap: var(--s2);
  margin-bottom: var(--s5);
  flex-wrap: wrap;
}
.step-chip {
  display: flex;
  align-items: center;
  gap: var(--s2);
  padding: var(--s2) var(--s3);
  border: 1px solid var(--line-1);
  border-radius: var(--r-pill);
  background: var(--bg-surface);
  color: var(--text-3);
  font-size: 12px;
  cursor: pointer;
  transition: border-color .15s ease, color .15s ease;
}
.step-chip:hover { border-color: var(--line-3); color: var(--text-2); }
.step-chip .step-num {
  width: 18px; height: 18px;
  display: grid; place-items: center;
  border-radius: 50%;
  border: 1px solid currentColor;
  font-size: 10px;
  font-family: var(--font-mono);
  flex: none;
}
.step-chip[data-state="done"] { color: var(--accent); border-color: var(--accent-line); }
.step-chip[data-state="current"] {
  color: var(--text-1);
  border-color: var(--accent);
  background: var(--accent-bg);
}

/* ============================ 检定结果 ============================ */

.roll-card {
  background: var(--bg-raised);
  border: 1px solid var(--line-2);
  border-left: 3px solid var(--line-3);
  border-radius: var(--r2);
  padding: var(--s4);
  margin-bottom: var(--s3);
}
.roll-card.lv-ok   { border-left-color: var(--accent); }
.roll-card.lv-bad  { border-left-color: var(--danger); }
.roll-card.lv-warn { border-left-color: var(--warn); }

.roll-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--s3);
  margin-bottom: var(--s3);
}
.roll-title { font-size: 14px; }
.roll-verdict { font-size: 15px; font-weight: 500; }

.roll-dice { display: flex; gap: var(--s2); flex-wrap: wrap; margin-bottom: var(--s3); padding-top: 17px; }
.die {
  position: relative;   /* 让「十位 / 个位」标签以本骰为基准 —— 早先只有 .die-tens 有，
                           于是个位骰的标签跑到了别的定位祖先上 */
  width: 34px; height: 34px;
  display: grid; place-items: center;
  background: var(--bg-inset);
  border: 1px solid var(--line-2);
  border-radius: var(--r2);
  font-family: var(--font-mono);
  font-size: 14px;
  color: var(--text-1);
}
.die.die-used { border-color: var(--accent); color: var(--accent-hi); }
.die.die-drop { opacity: .35; text-decoration: line-through; }
/* 标签放在骰面**上方之外**，不压住点数 ——
   原先 top: -7px 会盖掉数字的上半部分（十位骰尤其明显），
   配合 .roll-dice 的 padding-top 留出的空间 */
.die-tag {
  position: absolute; bottom: calc(100% + 3px); left: 50%; transform: translateX(-50%);
  font-size: 9px; line-height: 1; padding: 1px 3px; border-radius: 2px;
  background: var(--bg-raised); color: var(--text-3);
  border: 1px solid var(--line-1);
  white-space: nowrap;
}

.roll-meta {
  display: flex; gap: var(--s4); flex-wrap: wrap;
  font-size: 12px; color: var(--text-2);
  padding-top: var(--s3);
  border-top: 1px solid var(--line-1);
}
.roll-meta b { font-family: var(--font-mono); color: var(--text-1); font-weight: 400; }
.roll-note { font-size: 12px; color: var(--text-3); margin-top: var(--s2); }

/* ============================ 理智日志 ============================ */

.san-bar {
  height: 8px;
  background: var(--bg-inset);
  border: 1px solid var(--line-1);
  border-radius: var(--r-pill);
  overflow: hidden;
  margin-top: var(--s2);
}
.san-bar-fill {
  height: 100%;
  background: var(--accent);
  transition: width .3s ease;
}
.san-bar-fill[data-threat="ok"] { background: var(--accent); }
.san-bar-fill[data-threat="neutral"] { background: var(--info); }
.san-bar-fill[data-threat="high"] { background: var(--warn); }
.san-bar-fill[data-threat="critical"] { background: var(--danger); }

.log-list { display: flex; flex-direction: column; gap: var(--s1); }
.log-row {
  display: grid;
  grid-template-columns: 76px 1fr auto auto;
  gap: var(--s3);
  align-items: center;
  padding: var(--s2) var(--s3);
  border: 1px solid var(--line-1);
  border-radius: var(--r2);
  background: var(--bg-surface);
  font-size: 13px;
}
.log-day { font-family: var(--font-mono); font-size: 12px; color: var(--text-3); }
.log-loss { font-family: var(--font-mono); color: var(--danger); }

/* ============================ 空状态 ============================ */

.empty {
  border: 1px dashed var(--line-2);
  border-radius: var(--r3);
  padding: var(--s7) var(--s5);
  text-align: center;
  color: var(--text-2);
}
.empty h3 { font-size: 15px; margin-bottom: var(--s2); color: var(--text-1); }
.empty p { font-size: 13px; color: var(--text-2); max-width: 46ch; margin: 0 auto var(--s4); }

/* ============================ 提示条 ============================ */

.notice {
  display: flex;
  gap: var(--s3);
  padding: var(--s3) var(--s4);
  border-radius: var(--r2);
  border: 1px solid var(--line-2);
  background: var(--bg-raised);
  font-size: 13px;
  color: var(--text-2);
  line-height: 1.6;
}
.notice-warn { border-color: var(--warn-line); background: var(--warn-bg); color: var(--warn); }
.notice-danger { border-color: var(--danger-line); background: var(--danger-bg); color: var(--danger); }
.notice-info { border-color: var(--info-line); background: var(--info-bg); color: var(--info); }
.notice b { color: inherit; font-weight: 500; }

/* ============================ 弹层 ============================ */

.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(0, 0, 0, .72);
  display: grid; place-items: center;
  padding: var(--s5);
  z-index: 100;
}
.modal-backdrop[hidden] { display: none; }
.modal {
  background: var(--bg-surface);
  border: 1px solid var(--line-2);
  border-radius: var(--r4);
  width: min(680px, 100%);
  max-height: 80vh;
  display: flex; flex-direction: column;
}
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--s4);
  padding: var(--s4) var(--s5);
  border-bottom: 1px solid var(--line-1);
}
.modal-head h2 { font-family: var(--font-serif); font-size: 17px; }
.modal-body { padding: var(--s5); overflow-y: auto; font-size: 13px; line-height: 1.7; color: var(--text-2); }
.modal-body h3 { font-size: 14px; color: var(--text-1); margin: var(--s4) 0 var(--s2); }
.modal-body h3:first-child { margin-top: 0; }
.modal-body code, .legal-text {
  font-family: var(--font-mono);
  font-size: 12px;
  background: var(--bg-inset);
  border: 1px solid var(--line-1);
  border-radius: var(--r1);
  padding: var(--s1) var(--s2);
}
.legal-text { display: block; padding: var(--s3); line-height: 1.7; white-space: pre-wrap; color: var(--text-2); }

/* ============================ Toast ============================ */

.toast-host {
  position: fixed;
  right: var(--s5); bottom: var(--s5);
  display: flex; flex-direction: column; gap: var(--s2);
  z-index: 200;
  pointer-events: none;
}
.toast {
  background: var(--bg-overlay);
  border: 1px solid var(--line-3);
  border-radius: var(--r2);
  padding: var(--s3) var(--s4);
  font-size: 13px;
  color: var(--text-1);
  min-width: 200px;
}
.toast-ok { border-color: var(--accent-line); }
.toast-bad { border-color: var(--danger-line); color: var(--danger); }

/* ============================ 速查列表（可折叠） ============================ */

details.card > summary {
  cursor: pointer;
  font-size: 13px;
  color: var(--text-2);
  list-style: none;
  display: flex;
  align-items: center;
  gap: var(--s2);
}
details.card > summary::-webkit-details-marker { display: none; }
details.card > summary::before {
  content: "";
  width: 0; height: 0;
  border-left: 5px solid currentColor;
  border-top: 4px solid transparent;
  border-bottom: 4px solid transparent;
  transition: transform .15s ease;
  flex: none;
}
details.card[open] > summary::before { transform: rotate(90deg); }
details.card > summary:hover { color: var(--text-1); }

.loss-group { margin-bottom: var(--s5); }
.loss-group:last-of-type { margin-bottom: var(--s3); }
.loss-group h4 {
  font-size: 12px;
  color: var(--text-3);
  letter-spacing: .06em;
  margin: 0 0 var(--s2);
  font-weight: 400;
}
.loss-list { display: flex; flex-direction: column; gap: var(--s1); }

.loss-chip {
  display: flex;
  align-items: baseline;
  gap: var(--s3);
  width: 100%;
  text-align: left;
  padding: var(--s2) var(--s3);
  background: var(--bg-raised);
  border: 1px solid var(--line-1);
  border-radius: var(--r2);
  color: var(--text-2);
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
  transition: border-color .15s ease, color .15s ease;
}
.loss-chip:hover { border-color: var(--accent-line); color: var(--text-1); }
.loss-format {
  font-family: var(--font-mono);
  color: var(--brass);
  flex: none;
  min-width: 76px;
}

/* ============================ 悬停解释 ============================ */

.tip {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 300;
  max-width: 330px;
  padding: var(--s3) var(--s4);
  background: var(--bg-overlay);
  border: 1px solid var(--line-3);
  border-radius: var(--r2);
  font-size: 12px;
  line-height: 1.7;
  color: var(--text-2);
  pointer-events: none;
  opacity: 0;
  transition: opacity .12s ease;
}
.tip.is-visible { opacity: 1; }
.tip-title {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-1);
  margin-bottom: var(--s2);
}
.tip-body { color: var(--text-2); }
.tip-meta {
  margin-top: var(--s3);
  padding-top: var(--s2);
  border-top: 1px solid var(--line-2);
  font-size: 11px;
  color: var(--text-3);
  line-height: 1.6;
}

/* 带解释的元素：给出可悬停的视觉暗示 */
[data-tip] { cursor: help; }
input[data-tip], select[data-tip], textarea[data-tip], button[data-tip] { cursor: auto; }

/* ============================ 技能标记 ============================ */

.badge-core {
  background: var(--warn-bg);
  border-color: var(--warn-line);
  color: var(--brass);
}
.badge-rec {
  background: var(--info-bg);
  border-color: var(--info-line);
  color: var(--info);
}

tbody tr.is-core { background: rgba(201, 169, 97, .05); }
tbody tr.is-core td:first-child { box-shadow: inset 2px 0 0 var(--brass); }
tbody tr.is-core:hover { background: rgba(201, 169, 97, .1); }


/* 「必投」标记：信用评级这类不投就一定不达标的技能 */
.badge-req {
  background: var(--danger-bg);
  border-color: var(--danger-line);
  color: var(--danger);
}
tbody tr.is-credit { background: rgba(200, 90, 90, .06); }
tbody tr.is-credit td:first-child { box-shadow: inset 2px 0 0 var(--danger); }
tbody tr.is-credit:hover { background: rgba(200, 90, 90, .11); }

/* ============================ 点数预算 ============================ */

.budget-row {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr)) auto;
  gap: var(--s3);
  align-items: stretch;
}
.budget-card {
  border: 1px solid var(--line-2);
  border-radius: var(--r3);
  background: var(--bg-surface);
  padding: var(--s3) var(--s4);
  display: flex;
  flex-direction: column;
  gap: var(--s1);
}
.budget-card.is-over { border-color: var(--danger-line); background: var(--danger-bg); }
.budget-head { font-size: 11px; letter-spacing: .06em; color: var(--text-3); }
.budget-remain {
  font-family: var(--font-mono);
  font-size: 26px;
  line-height: 1.1;
  color: var(--text-1);
  display: flex;
  align-items: baseline;
  gap: var(--s2);
}
.budget-remain .dim { font-size: 11px; letter-spacing: .06em; }
.budget-card.is-over .budget-remain { color: var(--danger); }
.budget-sub { font-size: 12px; color: var(--text-3); }
.budget-sub b { font-family: var(--font-mono); color: var(--text-2); font-weight: 600; }
.budget-actions {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: var(--s2);
  min-width: 190px;
}
.budget-actions .field-help { margin: 0; }

/* 购点法：总量输入 + 随机分配 */
.point-buy-row {
  display: flex;
  align-items: center;
  gap: var(--s3);
  flex-wrap: wrap;
  padding-top: var(--s3);
  border-top: 1px solid var(--line-1);
}
.point-buy-row .skill-input { width: 110px; }

/* ============================ 习惯恐惧 ============================ */

.habit-list { display: flex; flex-direction: column; gap: var(--s3); }
.habit-item {
  border: 1px solid var(--line-1);
  border-radius: var(--r2);
  padding: var(--s3);
  display: flex;
  flex-direction: column;
  gap: var(--s2);
}
.habit-item.is-done { border-color: var(--info-line); background: var(--info-bg); }
.habit-main { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
.habit-main .spacer { flex: 1; }
.habit-name { font-weight: 600; }
.habit-bar {
  height: 6px;
  border-radius: var(--r-pill);
  background: var(--bg-raised);
  overflow: hidden;
}
.habit-bar > span { display: block; height: 100%; background: var(--brass); }
.habit-item.is-done .habit-bar > span { background: var(--info); }
.habit-actions { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
.habit-actions .spacer { flex: 1; }
.habit-actions .skill-input { width: 96px; }

/* ============================ 中毒 ============================ */

.poison-inputs {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--s3);
}
.poison-result {
  border: 1px solid var(--line-2);
  border-left: 3px solid var(--warn);
  border-radius: var(--r2);
  padding: var(--s3);
  display: flex;
  flex-direction: column;
  gap: var(--s2);
}
.poison-result.is-bad { border-left-color: var(--danger); background: var(--danger-bg); }
.poison-result-head {
  display: flex;
  align-items: center;
  gap: var(--s2);
  flex-wrap: wrap;
}
.poison-result-head .spacer { flex: 1; }
.poison-result-body { color: var(--text-2); line-height: 1.7; }
.poison-result-body b { color: var(--text-1); }
.poison-symptoms { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; color: var(--text-3); }
.poison-symptom {
  padding: 1px var(--s2);
  border: 1px solid var(--line-2);
  border-radius: var(--r-pill);
  font-size: 11px;
}
.poison-table .compact-table td:first-child { max-width: 200px; }

/* ============================ 价目表 ============================ */

.price-block { border-top: 1px solid var(--line-1); padding-top: var(--s3); }
.price-groups { display: flex; flex-direction: column; gap: var(--s4); }
.price-group-head {
  font-size: 11px;
  letter-spacing: .06em;
  color: var(--text-3);
  padding-bottom: var(--s1);
  border-bottom: 1px solid var(--line-1);
  margin-bottom: var(--s2);
}
.price-group .compact-table td { padding: 3px 0; }
.price-list summary { cursor: pointer; }

/* ============================ 孤注一掷 ============================ */

.push-block {
  border: 1px solid var(--line-2);
  border-left: 3px solid var(--brass);
  border-radius: var(--r2);
  padding: var(--s3);
  margin-top: var(--s3);
  display: flex;
  flex-direction: column;
  gap: var(--s2);
}
.push-block.is-open { border-left-color: var(--accent); background: var(--accent-bg); }
.push-block.is-bad { border-left-color: var(--danger); background: var(--danger-bg); }
.push-block.is-blocked { border-left-color: var(--line-3); opacity: .85; }
.push-head { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
.push-head .spacer { flex: 1; }
.push-reason {
  font-size: 13px;
  color: var(--text-1);
  border-left: 2px solid var(--line-2);
  padding-left: var(--s3);
}
.push-note { font-size: 12px; color: var(--text-2); line-height: 1.6; }
.push-error { font-size: 12px; color: var(--danger); }
.push-block textarea {
  width: 100%;
  min-height: 52px;
  resize: vertical;
  font-family: inherit;
  font-size: 13px;
}
.push-cons-group { margin-top: var(--s3); }
.push-cons-head {
  font-size: 11px;
  letter-spacing: .06em;
  color: var(--text-3);
  margin-bottom: var(--s2);
}
.push-cons-items { display: flex; flex-wrap: wrap; gap: var(--s2); }
.push-cons-item {
  padding: 1px var(--s2);
  border: 1px solid var(--line-2);
  border-radius: var(--r-pill);
  font-size: 11px;
  color: var(--text-2);
}

/* ============================ 村规设置 ============================ */

.house-rule-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--s3);
  padding: var(--s2) 0;
  border-bottom: 1px solid var(--line-1);
}
.house-rule-row:last-child { border-bottom: none; }
.house-rule-row.is-changed { background: var(--warn-bg); margin: 0 calc(-1 * var(--s2)); padding-left: var(--s2); padding-right: var(--s2); }
.house-rule-name { font-size: 13px; }
.house-rule-changed { font-size: 11px; color: var(--brass); margin-left: var(--s2); }
.house-rule-row .skill-input { width: 84px; text-align: center; }
.house-rule-diff {
  border-left: 3px solid var(--brass);
  padding-left: var(--s3);
  font-size: 12px;
  line-height: 1.7;
  color: var(--text-2);
}

/* ============================ 连续检定 ============================ */

.quick-block {
  margin-top: var(--s4);
  padding-top: var(--s3);
  border-top: 1px solid var(--line-1);
}
.quick-head { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; margin-bottom: var(--s2); }
.quick-chips { display: flex; flex-wrap: wrap; gap: var(--s2); }
/* 「更多技能」：默认收起，免得抽屉一上来就是一面墙；展开后仍是同一排 chip */.quick-more > summary {
  cursor: pointer;
  color: var(--text-2);
  font-size: 12px;
}
.quick-more > summary:hover { color: var(--text-1); }

/* 结果旁的「必要后续」：重伤之后该做的事就在结果下面做完 */
.roll-followup {
  margin-top: var(--s3);
  padding-top: var(--s3);
  border-top: 1px dashed var(--line-1);
}

/* 资源卡的「精确」入口：默认收起 —— 拖动与 ±1 是桌上的主路径，逐位输入属少数情况 */
.res-exact { display: flex; justify-content: center; align-items: center; min-width: 0; }
.res-exact > summary {
  cursor: pointer; color: var(--text-2); font-size: 12px;
  list-style: none; padding: 2px 6px; border: 1px dashed var(--line-2); border-radius: var(--r1);
}
.res-exact > summary::-webkit-details-marker { display: none; }
.res-exact > summary:hover, .res-exact[open] > summary { color: var(--text-1); border-color: var(--accent-line); }
.res-exact[open] { flex-direction: column; align-items: stretch; }

/* 整块可点的卡片：只加「可以点」的线索，不改卡内控件 —— 原来的按钮照旧是最明确的入口 */
.card-clickable { cursor: pointer; }
.card-clickable:hover { border-color: var(--accent-line); }

/* 表格里的文字入口：看着像链接，本质仍是按钮（键盘可达、语义正确） */
.link-btn {
  padding: 0; border: none; background: none;
  color: var(--text-1); font: inherit; text-align: left;
  cursor: pointer; text-decoration: underline;
  text-decoration-color: var(--line-2); text-underline-offset: 3px;
}
.link-btn:hover { color: var(--accent-hi); text-decoration-color: var(--accent-line); }

/* 整行可点的事项：hover 时给整行一点反馈，行内按钮仍然独立 */
.attention-row, .guide-step { border-radius: var(--r1); }
.attention-row[data-row-action], .guide-step[data-row-action] { cursor: pointer; }
.quick-chip {
  padding: 3px 10px;
  border: 1px solid var(--line-2);
  border-radius: 999px;
  background: var(--bg-surface);
  color: var(--text-1);
  font-size: 12px;
  cursor: pointer;
}
.quick-chip:hover { border-color: var(--accent); color: var(--accent); }
.recent-strip {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s2);
  align-items: center;
  margin-top: var(--s3);
  padding-top: var(--s2);
  border-top: 1px dashed var(--line-1);
}
.recent-item {
  padding: 2px 8px;
  border-radius: var(--r1);
  background: var(--bg-raised);
  font-size: 12px;
}

/* 需要留意的就地提示（例如「攻击方与当前行动者不一致」） */
.field-help.attn { color: var(--brass); }

/* ============================ 待办（智力检定） ============================ */

/**
 * 常驻的待办条。
 *
 * 刻意做得比普通信息条更"硬"：左边一条粗色边 + 一个「待办」徽标。
 * 因为它的失败模式是**被忽略** —— 规则要求紧接着做的步骤，
 * 一旦用户没注意到就等于掉了，而掉这一步不会报任何错。
 */
.pending-block {
  border: 1px solid var(--line-2);
  border-left: 3px solid var(--brass);
  border-radius: var(--r2);
  padding: var(--s3);
  margin-bottom: var(--s4);
  background: var(--bg-raised);
}
.pending-head {
  display: flex;
  align-items: center;
  gap: var(--s2);
  flex-wrap: wrap;
}
.pending-badge {
  display: inline-block;
  padding: 1px 7px;
  border-radius: 999px;
  background: var(--brass);
  color: var(--bg-base);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .04em;
}
.pending-block .field-help { margin-bottom: var(--s2); }
.pending-block .btn-row { margin-top: 0; }

/* ============================ 向导：滚动时保持定位 ============================ */

/**
 * 步骤条与**问题汇总**一起固定住。
 *
 * 为什么必须做：向导第 3 步（技能点）有 185 行技能表，内容高是视口的 2 倍以上 ——
 * 滚到中部时，上面看不到「第几 / 共几步」，下面找不到「继续」。
 * 用户既不知道自己在哪，也不知道要滚多远才能前进。
 *
 * 汇总框也放进来，是为了让「点了继续却过不去」这件事在任何滚动位置都看得见 ——
 * 有了它，就不必再弹一个 toast 重复同一句话。
 *
 * sticky 的相对容器是 `#viewport`（它才是滚动容器），不是 window。
 */
.wizard-sticky-head {
  position: sticky;
  top: 0;
  z-index: 3;
  background: var(--bg-base);
  padding-bottom: var(--s2);
}
.wizard-nav {
  position: sticky;
  bottom: 0;
  z-index: 3;
  background: var(--bg-base);
  padding: var(--s3) 0;
  border-top: 1px solid var(--line-1);
  margin-top: var(--s4);
}

/* ============================ 理智就地结算 ============================ */

.settle-block {
  border: 1px solid var(--line-2);
  border-left: 3px solid var(--accent);
  border-radius: var(--r2);
  padding: var(--s3);
  margin-top: var(--s3);
  background: var(--bg-raised);
}
.settle-block.is-done {
  border-left-color: var(--brass);
  background: var(--bg-surface);
}
.settle-head { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
.settle-block .field-help { margin-bottom: 0; }

/* ============================ 规则包 ============================ */

.rp-list { display: flex; flex-direction: column; gap: var(--s3); }
.rp-card {
  border: 1px solid var(--line-2);
  border-radius: var(--r2);
  padding: var(--s3);
  background: var(--bg-surface);
}
.rp-card.is-off { opacity: .62; border-style: dashed; }
.rp-head { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
.rp-head .spacer { flex: 1; }
.rp-facts {
  display: flex;
  gap: var(--s4);
  flex-wrap: wrap;
  margin-top: var(--s2);
  font-size: 12px;
  color: var(--text-2);
}
.rp-issues { list-style: none; margin: var(--s2) 0 0; padding: 0; font-size: 12px; line-height: 1.7; }
.rp-issues .is-error { color: var(--danger); }
.rp-issues .is-warn { color: var(--brass); }
.rp-legal { margin-top: var(--s2); }
.rp-legal summary { cursor: pointer; color: var(--text-3); }

/* ============================ 恢复治疗 ============================ */

.recovery-block {
  border: 1px solid var(--line-2);
  border-left: 3px solid var(--brass);
  border-radius: var(--r2);
  padding: var(--s3);
  background: var(--bg-raised);
}
.recovery-block .field-help { margin-bottom: 0; }
.recovery-block .field-help + .field-help { margin-top: var(--s1); }

/* ============================ 联合检定 ============================ */

.comb-block {
  border: 1px solid var(--line-2);
  border-left: 3px solid var(--accent);
  border-radius: var(--r2);
  padding: var(--s3);
  background: var(--bg-raised);
}
.comb-list {
  list-style: none;
  margin: var(--s2) 0 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--s1);
}
.comb-item {
  display: flex;
  align-items: center;
  gap: var(--s2);
  padding: var(--s1) 0;
  border-bottom: 1px solid var(--line-1);
  font-size: 13px;
}
.comb-item:last-child { border-bottom: none; }
.comb-name { flex: 1; min-width: 0; }
.comb-item .skill-input { width: 72px; text-align: center; }
.comb-item.is-dim { opacity: .5; }

/* ============================ 追逐轮 ============================ */

.chase-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: var(--s4);
  align-items: start;
}
.chase-col { display: flex; flex-direction: column; gap: var(--s4); min-width: 0; }

/* 跑道：横向一排地点。
   每列宽度不固定 —— 地点是叙事单位，长度本来就不一样，
   画成等距格子会暗示一件规则没有说的事。 */
.track-wrap { overflow-x: auto; padding-bottom: var(--s2); }
.track-row { display: flex; gap: var(--s2); min-width: min-content; }
.track-col {
  flex: 1 0 84px;
  border: 1px solid var(--line-2);
  border-radius: var(--r2);
  padding: var(--s2);
  background: var(--bg-surface);
  display: flex;
  flex-direction: column;
  gap: var(--s1);
  min-height: 104px;
}
.track-col.loc-open { border-style: dashed; }
.track-col.loc-regular { border-color: var(--warn-line); }
.track-col.loc-hard { border-color: var(--danger-line); background: var(--warn-bg); }
.track-col.loc-extreme { border-color: var(--danger); background: var(--danger-bg); }
.track-loc-index { font-family: var(--font-mono); font-size: 11px; color: var(--text-3); }
.track-loc-band { font-size: 10px; color: var(--text-3); }
.track-pieces { display: flex; flex-wrap: wrap; gap: 3px; margin-top: auto; }
.track-piece {
  font-size: 10px;
  padding: 1px 5px;
  border-radius: var(--r2);
  border: 1px solid;
  white-space: nowrap;
}
.track-piece.is-flee { border-color: var(--warn-line); background: var(--warn-bg); color: var(--brass); }
.track-piece.is-pursue { border-color: var(--danger-line); background: var(--danger-bg); color: var(--danger); }
.track-legend { display: flex; align-items: center; gap: var(--s3); margin-top: var(--s2); }
.track-legend .spacer { flex: 1; }
.track-key { font-size: 11px; padding: 1px 6px; border-radius: var(--r2); border: 1px solid; }
.track-key.is-flee { border-color: var(--warn-line); color: var(--brass); }
.track-key.is-pursue { border-color: var(--danger-line); color: var(--danger); }

.turn-order { display: flex; flex-wrap: wrap; gap: var(--s2); }
.turn-chip {
  display: inline-flex;
  align-items: center;
  gap: var(--s2);
  padding: var(--s1) var(--s3);
  border: 1px solid var(--line-2);
  border-radius: var(--r-pill);
  background: var(--bg-surface);
  color: var(--text-2);
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
}
.turn-chip.is-current { border-color: var(--accent-line); background: var(--accent-bg); color: var(--text-1); }
.turn-chip.is-flee { border-left: 3px solid var(--brass); }
.turn-chip.is-pursue { border-left: 3px solid var(--danger); }

.chase-act {
  border: 1px solid var(--line-2);
  border-radius: var(--r2);
  padding: var(--s3);
  background: var(--bg-raised);
}
.chase-act-head { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
.chase-act-head .spacer { flex: 1; }

.hazard-block {
  border: 1px solid var(--warn-line);
  border-left: 3px solid var(--warn);
  border-radius: var(--r2);
  padding: var(--s3);
  background: var(--warn-bg);
}
.hazard-head { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }

.chase-log { display: flex; flex-direction: column; gap: var(--s1); }
.chase-log-item {
  display: flex;
  gap: var(--s2);
  font-size: 12px;
  color: var(--text-2);
  line-height: 1.6;
  padding: var(--s1) 0;
  border-bottom: 1px solid var(--line-1);
}
.chase-log-item:last-child { border-bottom: none; }
.chase-log-item.is-warn { color: var(--brass); }
.chase-log-item .mono { flex: 0 0 34px; }

@media (max-width: 1180px) {
  .chase-grid { grid-template-columns: minmax(0, 1fr); }
}

.skill-cell { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }

/* 技能表上方的筛选条 */
.filter-bar {
  display: flex;
  align-items: center;
  gap: var(--s2);
  flex-wrap: wrap;
  margin-bottom: var(--s3);
}
.filter-bar .spacer { flex: 1; }
.filter-chip {
  padding: var(--s1) var(--s3);
  border: 1px solid var(--line-2);
  border-radius: var(--r-pill);
  background: var(--bg-surface);
  color: var(--text-3);
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
  transition: border-color .15s ease, color .15s ease;
}
.filter-chip:hover { border-color: var(--line-3); color: var(--text-2); }
.filter-chip[aria-pressed="true"] {
  background: var(--accent-bg);
  border-color: var(--accent-line);
  color: var(--accent-hi);
}

/* ============================ 战斗轮 ============================ */

.order-strip { display: flex; gap: var(--s2); flex-wrap: wrap; }

.order-chip {
  display: flex;
  align-items: center;
  gap: var(--s2);
  padding: var(--s2) var(--s3);
  border: 1px solid var(--line-2);
  border-radius: var(--r-pill);
  background: var(--bg-raised);
  color: var(--text-2);
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
  transition: border-color .15s ease, color .15s ease, opacity .15s ease;
}
.order-chip:hover { border-color: var(--line-3); color: var(--text-1); }
.order-chip[data-state="current"] {
  border-color: var(--accent);
  background: var(--accent-bg);
  color: var(--accent-hi);
}
.order-chip[data-state="done"] { opacity: .45; }
.order-dex { font-family: var(--font-mono); font-size: 10px; color: var(--text-3); }
.order-chip[data-state="current"] .order-dex { color: inherit; }

.combatant {
  border: 1px solid var(--line-1);
  border-radius: var(--r2);
  padding: var(--s3);
  background: var(--bg-surface);
}
.combatant.is-current { border-color: var(--accent-line); background: var(--accent-bg); }

.combatant-head { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
.combatant-head .btn { margin-left: auto; }

.combatant-name {
  background: none;
  border: none;
  padding: 0;
  color: var(--text-1);
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  text-align: left;
}
.combatant-name:hover { color: var(--accent-hi); }

.combatant-stats {
  display: flex;
  align-items: center;
  gap: var(--s2);
  flex-wrap: wrap;
  margin: var(--s3) 0 var(--s2);
}
.combatant-stats .skill-input { width: 56px; }

.rule-list {
  margin: 0;
  padding-left: 1.15em;
  font-size: 12px;
  line-height: 1.75;
  color: var(--text-2);
}
.rule-list li { margin-bottom: var(--s2); }
.rule-list li:last-child { margin-bottom: 0; }

/* ============================ 角色库卡片 ============================ */

.char-grid-cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(272px, 1fr));
  gap: var(--s4);
}

.char-card {
  display: flex;
  flex-direction: column;
  gap: var(--s3);
  padding: var(--s4);
  background: var(--bg-surface);
  border: 1px solid var(--line-1);
  border-radius: var(--r3);
  transition: border-color .15s ease;
  cursor: pointer;
}
.char-card:hover { border-color: var(--line-2); }
.char-card.is-current {
  border-color: var(--accent-line);
  background: linear-gradient(180deg, var(--accent-bg) 0%, var(--bg-surface) 60%);
}

.char-card-head { display: flex; flex-direction: column; gap: 2px; }
/* 卡片可点即打开 —— 用一个 › 把这件事说出来，而不是再塞一个按钮 */
.char-card-top { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s2); }
.char-card-go { color: var(--text-3); font-size: 18px; line-height: 1; transition: color .15s ease; }
.char-card:hover .char-card-go { color: var(--accent-hi); }
.char-card-name {
  font-size: 15px;
  font-weight: 500;
  color: var(--text-1);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.char-card-sub { font-size: 12px; color: var(--text-3); }

.char-card-tags { display: flex; gap: var(--s1); flex-wrap: wrap; }
.char-card-tags:empty { display: none; }

.char-card-vitals { display: flex; flex-direction: column; gap: var(--s3); }
.char-card-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: 12px;
  color: var(--text-2);
  margin-bottom: 5px;
}
.char-card-row .mono { font-family: var(--font-mono); color: var(--text-1); }

.char-card-attrs {
  display: flex;
  gap: var(--s4);
  flex-wrap: wrap;
  font-size: 11px;
  color: var(--text-3);
  font-family: var(--font-mono);
}
.char-card-attrs b { color: var(--text-1); font-weight: 400; }

.char-card-meta {
  display: flex;
  gap: var(--s3);
  flex-wrap: wrap;
  font-size: 11px;
  color: var(--text-3);
  padding-top: var(--s3);
  border-top: 1px solid var(--line-1);
}

.char-card-actions {
  display: flex;
  gap: var(--s2);
  flex-wrap: wrap;
  margin-top: auto;
  /* 操作按钮区不继承卡片的「可点」手势 —— 否则点「删除」看起来也像在打开卡片 */
  cursor: default;
}
.char-card-actions .btn { flex: 0 0 auto; }

/* —— 概览页的角色库缩略条 —— */

.mini-strip {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
  gap: var(--s2);
}

.mini-card {
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding: var(--s3);
  text-align: left;
  background: var(--bg-raised);
  border: 1px solid var(--line-1);
  border-radius: var(--r2);
  color: var(--text-2);
  font-family: inherit;
  cursor: pointer;
  transition: border-color .15s ease, color .15s ease;
}
.mini-card:hover { border-color: var(--accent-line); color: var(--text-1); }
.mini-card.is-current { border-color: var(--accent); background: var(--accent-bg); }

.mini-name {
  font-size: 13px;
  color: var(--text-1);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.mini-sub { font-size: 11px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini-vitals {
  display: flex;
  gap: var(--s2);
  font-size: 10px;
  color: var(--text-3);
  margin-top: 2px;
}
.tiny-badge { font-size: 9px; padding: 0 4px; align-self: flex-start; }

/* ============================ 概览页 ============================ */

/* 快捷动作：首页最该突出的是「下一步做什么」 */
.quick-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: var(--s3);
}

.quick-card {
  display: flex;
  flex-direction: column;
  gap: var(--s1);
  padding: var(--s4);
  text-align: left;
  background: var(--bg-surface);
  border: 1px solid var(--line-1);
  border-radius: var(--r3);
  color: var(--text-2);
  font-family: inherit;
  cursor: pointer;
  transition: border-color .15s ease, background-color .15s ease, color .15s ease;
}
.quick-card:hover:not(:disabled) {
  border-color: var(--accent-line);
  background: var(--bg-raised);
  color: var(--text-1);
}
.quick-card:disabled { opacity: .45; cursor: not-allowed; }

/**
 * ⚠️ 本工具有一条视觉语义约定：**有颜色的块 = 选中**
 * （`.turn-chip` / `.combatant` / `.char-card` / `.mini-card` 的 `.is-current` 全用实底强调色）。
 *
 * 所以「建议先做哪张卡」**不能用颜色表达** —— 试过两次都不对：
 *   ① 实底强调色 → 被读成「它一直被选中 / 绿色粘住了」（它确实不反映任何状态）；
 *   ② 灰底 + 左侧色条 → 仍然是「色块」，仍在暗示选中。
 * 正解是用**标签**（与车卡的「本职」「常用」同一套 badge），用文字说清它是什么。
 * 见 `overview.js` 挂的 `<span class="badge badge-rec">推荐</span>`。
 */
.quick-icon { color: inherit; opacity: .85; margin-bottom: var(--s1); }
.quick-label {
  display: flex;
  align-items: center;
  gap: var(--s2);
  font-size: 14px;
  color: var(--text-1);
}
.quick-hint { font-size: 11px; color: var(--text-3); }

/* 需要关注：只留真正要动作的事 */
.attention-row {
  display: flex;
  align-items: center;
  gap: var(--s3);
  padding: var(--s3) var(--s4);
  background: var(--bg-raised);
  border: 1px solid var(--line-1);
  border-left: 2px solid var(--warn);
  border-radius: var(--r2);
}
.attention-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--warn); flex: none;
}
.attention-text { flex: 1; font-size: 13px; color: var(--text-2); }
.attention-text b { color: var(--text-1); font-weight: 500; }

/* 上手引导 */
.guide-step {
  display: flex;
  align-items: flex-start;
  gap: var(--s3);
  padding: var(--s3);
  border: 1px solid var(--line-1);
  border-radius: var(--r2);
  background: var(--bg-surface);
}
.guide-num {
  width: 22px; height: 22px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 50%;
  border: 1px solid var(--accent-line);
  background: var(--accent-bg);
  color: var(--accent-hi);
  font-size: 11px;
  font-family: var(--font-mono);
}
.guide-step > div { flex: 1; }
.guide-step .btn { flex: none; }

/* ============================ 角色卡（主卡布局） ============================
   参照纸质人物卡的密集双栏：左栏固定宽度放「看形状的」，右栏放「打牌时真的会读的」。
   信息密度比别处高，所以行高与字号都压了一档。 */

.info-bar {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: var(--s4); flex-wrap: wrap;
  padding: var(--s4) var(--s5); margin-bottom: var(--s4);
}
.info-bar-main { min-width: 0; }
.info-bar-name { font-family: var(--font-serif); font-size: 20px; color: var(--text-1); margin-right: var(--s3); }
.info-bar-facts { display: flex; gap: var(--s4); flex-wrap: wrap; }

.sheet-grid { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: var(--s4); align-items: start; }
.sheet-col { display: grid; gap: var(--s4); min-width: 0; }

/* 一行的两半：属性表 | 战斗速览。战斗速览只占一半宽，格子落成两列 */
.sheet-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s4); align-items: start; }

/* 技能清单的两栏；少于 12 项时不拆（data-cols=1） */
.skill-cols { display: grid; gap: var(--s4); }
.skill-cols[data-cols="2"] { grid-template-columns: repeat(2, minmax(0, 1fr)); }

/* 紧凑卡片：主卡上到处都在省那几像素 */
.card-tight { padding: var(--s4); }
.card-tight > .card-title { margin-bottom: var(--s3); }

/* 可折叠区（雷达）：summary 做成卡头的样子，键盘与读屏都能用 */
details.card-tight > summary {
  cursor: pointer; list-style: none;
  display: flex; align-items: center; gap: var(--s2);
  font-size: 13px; color: var(--text-1);
}
details.card-tight > summary::-webkit-details-marker { display: none; }
details.card-tight > summary::before {
  content: "";
  width: 0; height: 0;
  border-left: 5px solid var(--text-3);
  border-top: 4px solid transparent;
  border-bottom: 4px solid transparent;
  transition: transform .15s ease;
}
details.card-tight[open] > summary::before { transform: rotate(90deg); }
details.card-tight > summary:hover { color: var(--accent-hi); }

.radar { display: block; width: 100%; max-width: 300px; margin: 0 auto; }

/* 密集表：属性表与 8 列技能表都用它 */
.compact-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.compact-table th {
  font-size: 11px; font-weight: 400; color: var(--text-3);
  text-align: right; padding: 3px 4px;
  border-bottom: 1px solid var(--line-1);
  white-space: nowrap;
}
.compact-table th:first-child { text-align: left; }
.compact-table td { padding: 3px; text-align: right; color: var(--text-2); }
.compact-table td:first-child { text-align: left; color: var(--text-1); padding-right: var(--s3); }
.compact-table td.strong { color: var(--text-1); font-size: 13px; }
.compact-table tr.is-core td:first-child { color: var(--brass); }
.compact-table tbody tr:hover { background: var(--bg-raised); }

/* 8 列技能表必须固定列宽 —— 自动布局会把「技能」列压成一条，
   因为右边 7 列的两位表头把宽度都吃掉了 */
.compact-table[data-skill-table] { table-layout: fixed; }
.compact-table[data-skill-table] th:first-child { width: 34%; }

/* 量尺的文字色调：只做辅助，分档本身写在格子里 */
.tc-brass { color: var(--brass); }
.tc-dim { color: var(--text-3); }
.tc-plain { color: var(--text-3); }

/* 战斗速览的键值格：只占半栏，所以固定两列 */
.kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s3) var(--s4); }
.kv-k { font-size: 11px; color: var(--text-3); }
.kv-v { font-size: 14px; color: var(--text-1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kv-v.mono { font-family: var(--font-mono); }

/* 状态区：四张卡并排，比别处的 .stat 更紧 */
.stat-compact { padding: var(--s3); }
.stat-compact .stat-label { font-size: 11px; margin-bottom: 0; }
/* 用 grid 而不是 flex —— flex + wrap 在窄卡里会把 +1 挤到下一行 */
.res-nudge { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--s2); align-items: center; }
.res-nudge .skill-input { width: 100%; min-width: 0; }

/* 背景条目标签；没填的用虚线灰底标出来，比一句「尚未填写」更容易扫 */
.bg-tags { display: flex; flex-wrap: wrap; gap: var(--s2); }
.bg-tag {
  display: inline-flex; align-items: center;
  padding: 1px var(--s2);
  border-radius: var(--r-pill);
  border: 1px solid var(--line-2);
  background: var(--bg-raised);
  font-size: 11px; color: var(--text-2);
}
.bg-tag.is-empty { border-style: dashed; border-color: var(--line-1); color: var(--text-3); }

/* 伤势标识：重伤是规则状态（倒地、每轮一个动作、不能自然恢复），
   不只是「血少」—— 所以用左侧色条 + 徽章双通道表达，不只靠颜色 */
.info-bar { position: relative; }
.info-bar.has-major { border-left: 3px solid var(--warn); }
.info-bar.has-dying {
  border-left: 3px solid var(--danger);
  background: linear-gradient(90deg, var(--danger-bg) 0%, transparent 40%);
}

.wound-badge {
  display: inline-flex; align-items: center;
  padding: 1px var(--s2); margin-right: var(--s3);
  border-radius: var(--r-pill);
  font-size: 11px; vertical-align: 2px;
}
.wound-badge.is-major { border: 1px solid var(--warn-line); color: var(--warn); background: var(--warn-bg); }
.wound-badge.is-dying { border: 1px solid var(--danger-line); color: var(--danger); background: var(--danger-bg); }

/* 拖动条留下的待确认：要把「为什么多问这一句」讲清楚，不能只弹个框 */
.wound-pending {
  padding: var(--s3);
  border: 1px solid var(--warn-line);
  border-left-width: 3px;
  border-radius: var(--r2);
  background: var(--warn-bg);
  font-size: 12px; color: var(--text-2);
  line-height: 1.7;
}

.wound-flags { display: flex; align-items: center; gap: var(--s4); flex-wrap: wrap; }
.wound-con { font-size: 12px; color: var(--text-2); }

.wound-rules > summary {
  cursor: pointer; font-size: 12px; color: var(--text-2); list-style: none;
}
.wound-rules > summary::-webkit-details-marker { display: none; }
.wound-rules > summary::before { content: "▸ "; color: var(--text-3); }
.wound-rules[open] > summary::before { content: "▾ "; }
.wound-rules > summary:hover { color: var(--accent-hi); }
.wound-rule-list { margin: var(--s2) 0 0; padding-left: var(--s5); font-size: 12px; color: var(--text-2); }
.wound-rule-list li { margin-bottom: 3px; line-height: 1.6; }

/* 可点击即检定的行：整行是按钮，所以要有明确的悬停反馈与键盘可达性 */.compact-table tr.is-checkable { cursor: pointer; }
.compact-table tr.is-checkable:hover { background: var(--accent-bg); }
.compact-table tr.is-checkable:hover td:first-child { color: var(--accent-hi); }
.compact-table tr.is-checkable:hover .check-hint { opacity: 1; }
.compact-table tr.is-checkable:focus-within {
  outline: 1px solid var(--accent-line);
  outline-offset: -1px;
}
/* 「检定」二字默认**半可见**。
   原先 `opacity: 0`、只在悬停时才出现 —— 后果是「这一行可以点」完全依赖
   鼠标停留，第一次用的人看到的只是一张普通数字表。半透明足以提示可点，
   又不至于在一片数字里变成噪音。 */
.check-hint {
  font-size: 11px; color: var(--accent-hi);
  /* 原先 .45 的透明度把「这一行可以检定」压到约 2.9:1 —— 它是**信息**不是装饰。
     弱化改由字号与位置承担，透明度只留一点点层次。 */
  opacity: .82; transition: opacity .12s ease;
  margin-left: var(--s2);
}

/* 检定抽屉：左参数右速查 */
.check-drawer { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: var(--s4); align-items: start; }
.check-side-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s3); }
.check-side-stats > div { min-width: 0; }
#check-drawer-result { margin-top: var(--s4); }
#check-drawer-result:empty { margin-top: 0; }

@media (max-width: 720px) {
  .check-drawer { grid-template-columns: minmax(0, 1fr); }
}

/* 向导顶部的「正在编辑谁 + 新建」条 —— 多张卡之间切换时最需要一眼看清的是这个 */
.wizard-bar {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--s4); flex-wrap: wrap;
  margin-bottom: var(--s4);
}
.wizard-bar-who { display: flex; align-items: baseline; gap: var(--s2); min-width: 0; }
.wizard-bar-who b { color: var(--text-1); }

/* 持久状态（恐惧症 / 躁狂症 / 创伤与疤痕）：角色卡上一块，理智页里可增删 */
.cond-summary { display: grid; gap: var(--s3); margin-top: var(--s4); }
.cond-group-head { display: flex; align-items: center; gap: var(--s2); margin-bottom: var(--s2); }
.bg-tag.is-cond { border-color: var(--warn-line); background: var(--warn-bg); color: var(--warn); padding-right: 2px; }
.cond-x {
  border: none; background: none; cursor: pointer;
  color: inherit; opacity: .55; font-size: 13px; line-height: 1;
  padding: 0 4px; margin-left: 2px;
}
.cond-x:hover { opacity: 1; }

.cond-list { display: grid; gap: var(--s2); }
.cond-item { border-left: 2px solid var(--line-2); padding-left: var(--s3); }
.cond-main { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
.cond-label { color: var(--text-1); }
.cond-desc { font-size: 12px; color: var(--text-2); margin-top: 3px; line-height: 1.6; }
.cond-note { font-size: 12px; color: var(--text-3); margin-top: 2px; }
.cond-item .spacer { flex: 1; }

/* 按小时恢复（如魔法值）：一行紧凑控件 */
.rest-row { display: flex; align-items: center; gap: var(--s2); justify-content: center; }
.rest-row .skill-input.sm { width: 48px; min-width: 0; }
/* 打印时只保留结果，撤掉这类交互控件 */
@media print { .rest-row { display: none !important; } }

/* 分段切换（单方 / 对抗） */
.seg-row { display: inline-flex; gap: 2px; padding: 2px; border: 0.5px solid var(--line-2); border-radius: var(--r2); margin-bottom: var(--s4); }
.seg {
  border: none; background: none; cursor: pointer;
  padding: var(--s1) var(--s4); border-radius: var(--r1);
  font-size: 12px; color: var(--text-2);
}
.seg:hover { color: var(--text-1); }
.seg.is-on { background: var(--accent-bg); color: var(--accent-hi); }

/* 对抗结果：双方并排，才看得出是怎么赢的 */
.opposed-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s4); margin: var(--s3) 0; }
.opposed-side { border-left: 2px solid var(--line-2); padding-left: var(--s3); min-width: 0; }
.opposed-side .roll-verdict { font-size: 13px; margin-top: var(--s2); }

@media (max-width: 720px) {
  .opposed-grid { grid-template-columns: minmax(0, 1fr); }
}

/* 全场状态板：对局中一眼扫过，所以只读、密度高、每行一条 */
.pb-card { padding: var(--s3) var(--s4); }
.pb-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3); margin-bottom: var(--s2); flex-wrap: wrap; }
.pb-list { display: grid; }
.pb-row {
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.6fr) auto;
  gap: var(--s3); align-items: center;
  width: 100%; text-align: left;
  padding: var(--s3) var(--s2);
  background: none; border: none; border-bottom: 0.5px solid var(--line-1);
  cursor: pointer; color: inherit; font: inherit;
}
.pb-row:last-child { border-bottom: none; }
.pb-row:hover { background: var(--bg-raised); }
.pb-name { display: flex; align-items: baseline; gap: var(--s2); flex-wrap: wrap; min-width: 0; }
.pb-bars { display: grid; gap: 3px; min-width: 0; }
.pb-bar-wrap { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: var(--s2); align-items: center; }
.pb-bar-label { font-size: 11px; color: var(--text-3); }
.pb-bar { height: 6px; border-radius: var(--r-pill); background: var(--bg-inset); border: 1px solid var(--line-1); overflow: hidden; }
.pb-bar i { display: block; height: 100%; background: var(--accent); }
.pb-bar i[data-threat="ok"] { background: var(--accent); }
.pb-bar i[data-threat="high"] { background: var(--warn); }
.pb-bar i[data-threat="critical"] { background: var(--danger); }
.pb-bar i[data-threat="neutral"] { background: var(--info); }
.pb-side { display: grid; gap: 2px; justify-items: end; white-space: nowrap; }

.pb-flag {
  font-size: 11px; padding: 0 var(--s2);
  border-radius: var(--r-pill); border: 0.5px solid;
}
.pb-flag.is-major { color: var(--warn); border-color: var(--warn-line); background: var(--warn-bg); }
.pb-flag.is-dying { color: var(--danger); border-color: var(--danger-line); background: var(--danger-bg); }
.pb-flag.is-out { color: var(--text-3); border-color: var(--line-2); }
.pb-flag.is-npc { color: var(--info); border-color: var(--info-line); }

@media (max-width: 760px) {
  .pb-row { grid-template-columns: minmax(0, 1fr); gap: var(--s2); }
  .pb-side { justify-items: start; }
}

/* 难度 · 目标值：既是选择器也是速查表。
   整行可点，所以要有明确的悬停与选中态；选中项左侧加色条，
   不只靠底色深浅 —— 深色主题下两者的对比度都很低。 */
.diff-pick { display: grid; gap: 2px; }
.diff-opt {
  display: grid; grid-template-columns: minmax(0, 1fr) auto;
  align-items: center; gap: var(--s3);
  width: 100%; text-align: left;
  padding: var(--s2) var(--s3);
  background: none; border: none;
  border-left: 2px solid transparent;
  border-radius: var(--r1);
  cursor: pointer; color: var(--text-2); font: inherit;
}
.diff-opt:hover { background: var(--bg-raised); color: var(--text-1); }
.diff-opt.is-on {
  background: var(--accent-bg);
  border-left-color: var(--accent);
  color: var(--accent-hi);
}
.diff-opt:focus-visible { outline: 1px solid var(--accent-line); outline-offset: -1px; }
.diff-name { font-size: 13px; }
.diff-value { font-size: 14px; }
.diff-opt.is-on .diff-value { color: var(--accent-hi); font-weight: 500; }

/* 关键背景关联：一行说明 + 一个换项按钮 */
.key-conn { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
.key-conn .btn { flex: none; }

/* ============================ 工具类 ============================ */

.mono { font-family: var(--font-mono); }
.muted { color: var(--text-2); }
.dim { color: var(--text-3); }
.tiny { font-size: 12px; }
.small { font-size: 12px; }
.right { text-align: right; }
.stack { display: flex; flex-direction: column; gap: var(--s3); }
.row { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; }
.mt-3 { margin-top: var(--s3); }
.mt-4 { margin-top: var(--s4); }
.mt-5 { margin-top: var(--s5); }
.mb-3 { margin-bottom: var(--s3); }
.mb-4 { margin-bottom: var(--s4); }
.hidden { display: none !important; }

/* ============================ 响应式 ============================ */

/* 技能拆两栏的前提是每栏都放得下 8 列 —— 窗口不够宽就退回单栏，
   挤成两条细缝比不拆更难读 */
@media (max-width: 1560px) {
  .skill-cols[data-cols="2"]:not([data-compact]) { grid-template-columns: minmax(0, 1fr); }
}

/* 紧凑两栏（只有「技能 / 总值 / 困难 / 极限」四列，例如车卡总览）：
   列少、每列窄，断点可以低得多 —— 否则 1280 这种常规窗口会白退成单栏，
   而四列并排本来完全放得下。`data-compact` 就是用来把这两种情况分开的。 */
@media (max-width: 1100px) {
  .skill-cols[data-cols="2"][data-compact] { grid-template-columns: minmax(0, 1fr); }
}

/* 预算那一排是「三张卡 + 一个操作块」的四列网格，窗口一窄就会把数字挤成两行。
   900px 以下改成两列、操作块独占一行 —— 宁可多占一行，也不要数字折行。 */
@media (max-width: 1180px) {
  .budget-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .budget-actions { grid-column: 1 / -1; min-width: 0; }
}
@media (max-width: 1180px) {
  .sheet-grid { grid-template-columns: minmax(0, 1fr); }
  /**
   * 窄屏把「状态／技能」那一列提到最前：首屏首先要能操作（HP／SAN／技能入口），
   * 人物资料、雷达、装备可以往后放。原先单列后沿用 DOM 顺序，于是首屏是姓名与雷达 ——
   * 打开角色卡第一眼看不到任何能操作的东西。
   * 代价要说清：**视觉顺序与 DOM 顺序分叉**，键盘 Tab 顺序仍按 DOM。
   */
  .sheet-col[data-primary] { order: -1; }
  .sheet-pair { grid-template-columns: minmax(0, 1fr); }
  .radar { max-width: 260px; }
}
@media (max-width: 900px) {  #app {
    grid-template-columns: minmax(0, 1fr);
    /**
     * 顶栏那一行原来是固定 56px —— 窄屏下它装不下「品牌 + 当前角色 + 保存状态 + 规则系统」
     * 时，`flex: none` 的子元素不会收缩，于是**整页被顶宽**（实测 390px 视口溢出 336px，
     * 必须横向滚动才能看到右边的按钮）。改成 auto，配合下面的折行即可。
     */
    grid-template-rows: auto auto minmax(0, 1fr);
    grid-template-areas:

     3. **不靠深色背景承载信息** —— 打印要么白底黑字，要么整片糊掉。

    --bg-surface: #fff;
    --bg-raised: #fff;
    --bg-overlay: #f7f7f5;
    --bg-inset: #f4f4f2;
    --bg-hover: #f0f0ee;
    --text-1: #111;
    --text-2: #333;
    --text-3: #666;
    --line-1: #bbb;
    --line-2: #999;
    --line-3: #666;
    --accent: #4a6b58;
    --accent-hi: #3a5644;
    --accent-bg: #eef4f0;
    --accent-line: #7d9a88;
    --danger: #a32d2d;
    --danger-bg: #fbecec;
    --danger-line: #d9a3a3;
    --warn: #8a6410;
    --warn-bg: #fdf6e3;
    --warn-line: #d9c58a;
    --info: #2c5f8a;
    --info-bg: #eaf2fa;
    --info-line: #a3c2dc;
    --brass: #7a5c1c;
  }

  html, body {
    background: #fff !important;
    color: #111;
    font-size: 11pt;
  }

  /* 屏幕专用件全部撤掉。
     注意 .toast-host 是实际的容器类名 —— 名字猜错会导致提示文字被打到纸上。 */
  .topbar,
  .sidebar,
  .btn,
  .btn-row,
  .modal-backdrop,
  .toast-host,
  .check-hint,
  .screen-only,
  .cond-x,
  .nav-group-label,
  [data-action],
  [data-check-target] .check-hint { display: none !important; }

  /* 表单控件在纸上没有意义：改成纯文本或直接撤掉 */
  select, textarea, input[type="number"], input[type="text"] {
    border: none !important;
    background: none !important;
    padding: 0 !important;
    appearance: none;
    -webkit-appearance: none;
    font: inherit;
    color: inherit;
  }
  /* 登记用的下拉与按钮成对出现，整体撤掉；已登记的清单（.gear-chip）保留 */
  .gear-chip-x,
  [data-gear-weapon-add],
  [data-gear-armor],
  [data-gear-action] { display: none !important; }
  .gear-chip { border: 0.5pt solid #999 !important; background: #fff !important; color: #222 !important; }

  /* 车卡向导里的点数预算与购点：按钮已由 [data-action] 撤掉，这里收掉空出来的格子 */
  .budget-row { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; }
  .budget-actions,
  .point-buy-row { display: none !important; }

  /* 习惯恐惧：纸上只保留记录本身，去掉记遭遇与幕间这些操作 */
  .habit-actions,
  .habit-card .row.mt-3,
  [data-habit-phase] { display: none !important; }
  .habit-bar { border: 0.5pt solid #999 !important; background: #fff !important; }
  .habit-bar > span { background: #666 !important; }

  /* 中毒：纸上留下最近一次结算的内容与速查表，操作控件撤掉 */
  .poison-form { display: none !important; }
  .poison-result { border-color: #999 !important; background: #fff !important; border-left-color: #666 !important; }
  .poison-result.is-bad { background: #fff !important; }

  /* 价目表在纸上会占掉一整页 —— 除非真要打印，否则默认收起 */
  .price-list[open] .price-groups { columns: 2; }

  /* 骨架改为单列铺满，去掉内边距与网格 */
  #app {
    display: block !important;
    grid-template-columns: none !important;
    grid-template-areas: none !important;

  .viewport {
    overflow: visible !important;
    padding: 0 !important;

  .card, .sheet-col > *, .stat-compact {

    background: #fff !important;
    box-shadow: none !important;
    break-inside: avoid;

  }

  .sheet-grid { gap: 8pt; }
  .sheet-pair { break-inside: avoid; page-break-inside: avoid; }
  .skill-cols { break-inside: auto; }
  table { break-inside: auto; }
  tr { break-inside: avoid; page-break-inside: avoid; }

  /* 表格：浅色下需要实线分隔，否则行会粘连 */
  .compact-table th { border-bottom: 0.5pt solid #666 !important; color: #333 !important; }
  .compact-table tbody tr:hover { background: transparent !important; }
  .compact-table td { color: #222 !important; }
  .compact-table tr.is-core td:first-child { color: var(--brass) !important; font-weight: 500; }

  /* 资源条：深色填充在黑白打印里会变成一团黑，且滑块本身就不可用，直接撤掉。
     数值本身保留（数字才是要读的东西），只去掉输入框的外观。 */
  .stat-range { display: none !important; }
  .res-nudge { display: block !important; }
  .res-nudge .btn { display: none !important; }
  .res-nudge .skill-input,
  .stat-compact .skill-input {
    border: none !important;
    background: none !important;
    width: auto !important;
    min-height: 0 !important;
    font-size: 15pt !important;
    font-weight: 500;
    padding: 0 !important;
  }
  /* 状态四联：纸上给两列就够，四列会挤到看不清 */
  .stat-compact .grid-4,
  .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }

  /* 雷达图与伤势标识：颜色只作辅助，边框保证黑白下也能看出层次 */
  .radar { stroke-width: 1.2 !important; }
  .info-bar { border: 0.5pt solid #999 !important; border-left-width: 3pt !important; }
  .info-bar.has-major { border-left-color: #8a6410 !important; }
  .info-bar.has-dying { border-left-color: #a32d2d !important; }
  .info-bar.has-dying { background: #fdf6e3 !important; }
  .wound-badge { border: 0.5pt solid currentColor !important; }
  .bg-tag { border: 0.5pt solid #999 !important; background: #fff !important; color: #333 !important; }

  /* 可折叠区一律展开 —— 纸上没有「点击展开」这回事 */
  details > summary { display: none !important; }
  details { display: block !important; }
  details > *:not(summary) { display: block !important; }

  /* 链接（如果有）露出地址，方便纸面追溯 */
  a[href]::after { content: " (" attr(href) ")"; font-size: 9pt; color: #555; }

  /* 页眉页脚留白 */
  @page { margin: 12mm 10mm; }
}

/* —— 概览：续团摘要条（「上次跑到哪」）—— */
.resume-card { padding: var(--s3) var(--s4); }
.resume-line { font-size: 13px; line-height: 1.6; color: var(--text-2); }
.resume-label {
  display: inline-block;
  margin-right: var(--s2);
  padding: 1px 7px;
  border-radius: var(--r-pill);
  background: var(--accent-bg);
  color: var(--accent-hi);
  font-size: 11px;
}
/* 「战斗轮未清空」是这条摘要里唯一需要立刻处理的事，用警示色把它顶出来 */
.resume-line b { color: var(--warn); font-weight: 600; }

    { id: "charm", label: "取悦", group: "social", base: 15, desc: "用亲和力、恭维或好感让对方愿意帮你 —— 是「让他想帮你」，不是逼他就范。无法让人做出违背本性的事。" },
    { id: "fast_talk", label: "话术", group: "social", base: 5, desc: "用一连串快速言语制造一个当下就能通过的缺口：一句谎、一次打岔、一段临时编的说辞。见效快但经不起事后推敲，失败往往会把场面搞砸。" },
    { id: "intimidate", label: "恐吓", group: "social", base: 15, desc: "用威胁、气势或亮出的家伙迫使对方服从 —— 是「让他觉得拒绝很危险」。管用，但会结下仇，也容易堵死以后的路。" },
    { id: "persuade", label: "说服", group: "social", base: 10, desc: "用道理、证据或交换条件打一场持久战。比话术慢，但成功之后关系更稳固。" },
    { id: "psychology", label: "心理学", group: "social", base: 10, recommended: true, desc: "判断对方的情绪、动机与可能反应，也能察觉「这人不对劲」。注意：它读的是态度，不是读心 —— 不会告诉你对方的私人想法。守秘人也可能代你暗掷。" },
    // —— 战斗 ——
    { id: "dodge", label: "闪避", group: "combat", base: "DEX / 2", recommended: true, desc: "躲开攻击，基值为敏捷的一半。每个战斗回合都能用，且不占用你的攻击机会 —— 生存率最高的战斗技能。机动或反击则要与对方比拼技能等级。" },
    { id: "fighting_brawl", label: "格斗（斗殴）", group: "combat", base: 25, desc: "徒手，或使用棍棒、石块、指虎这类简陋武器的近身搏斗。" },
    { id: "fighting_sword", label: "格斗（刀剑）", group: "combat", base: 20, desc: "使用刀、剑、砍刀等刃类武器近身作战。" },
    { id: "fighting_axe", label: "格斗（斧）", group: "combat", base: 15, desc: "使用斧类武器近身作战，伤害高但笨重。" },
    { id: "fighting_spear", label: "格斗（矛）", group: "combat", base: 20, desc: "使用矛、长枪等长柄武器，可在稍远处攻击。" },
    { id: "fighting_whip", label: "格斗（鞭）", group: "combat", base: 5, desc: "使用鞭类武器，多用于缴械或缠住对手。" },
    { id: "firearms_handgun", label: "火器（手枪）", group: "combat", base: 20, desc: "使用左轮与自动手枪射击。射程决定难度档，距离越远越难命中。" },
    { id: "firearms_rifle", label: "火器（步枪／霰弹枪）", group: "combat", base: 25, desc: "使用步枪与霰弹枪，有效距离远、伤害高，是 1920 年代调查员的主要重火力。" },
    { id: "firearms_smg", label: "火器（冲锋枪）", group: "combat", base: 15, desc: "使用冲锋枪，可连发与扫射。扫射按每轮分次结算，每多打一轮惩罚累加。" },
    { id: "firearms_mg", label: "火器（机枪）", group: "combat", base: 10, desc: "操作机枪进行压制与扫射。" },
    { id: "bow", label: "弓术", group: "combat", base: 15, desc: "使用弓或十字弓射击。属于飞行物武器，可与闪避对抗。" },
    { id: "throw", label: "投掷", group: "combat", base: 20, desc: "投掷标枪、飞刀、石块等。投掷依赖力量的武器时，只应用一半伤害加值。" },
    { id: "artillery", label: "炮术", group: "combat", base: 1, desc: "操作火炮、迫击炮等重型射击武器。" },
    { id: "demolitions", label: "爆破", group: "combat", base: 1, desc: "安放与拆除炸药，估算爆破范围与所需药量。" },
    // —— 医疗 ——
    { id: "first_aid", label: "急救", group: "medical", base: 30, recommended: true, desc: "紧急处理：止血、包扎、固定。须在受伤后一小时内施行，恢复 1 点生命值，也是唯一能把濒死同伴从死亡线上拉回来的手段。不能治疗疾病。" },
    { id: "medicine", label: "医学", group: "medical", base: 1, desc: "诊断与治疗：耗时至少一小时，在急救之外再恢复 1D3 点生命值；如果不在受伤当天施行则需要困难成功。也能看出伤口是否合乎常理 —— 法医方向的调查手段。" },
    { id: "psychoanalysis", label: "心理分析", group: "medical", base: 1, desc: "对精神创伤进行专业疏导，是帮助调查员从疯狂中恢复理智的手段之一。与心理学的分工：心理学负责看穿别人，心理分析负责治疗。" },
    // —— 运动 ——
    { id: "climb", label: "攀爬", group: "athletic", base: 20, desc: "攀上墙壁、翻越障碍、沿绳索升降。失败通常意味着摔下来。" },
    { id: "jump", label: "跳跃", group: "athletic", base: 20, desc: "跳过沟壑、跃过障碍。追逐场景中的常用检定。" },
    { id: "swim", label: "游泳", group: "athletic", base: 20, desc: "在水中活动与自救。不会游泳的人在深水面前几乎没有余地。" },
    { id: "ride", label: "骑术", group: "athletic", base: 5, desc: "驾驭马匹、骡子等骑乘动物。在 1920 年代仍有实用价值。" },
    // —— 知识 ——
    { id: "accounting", label: "会计", group: "knowledge", base: 5, desc: "查账、跟钱：从发票、工资单、账簿里看出财务上的异常。注意它与信用评级不是一回事。" },
    { id: "anthropology", label: "人类学", group: "knowledge", base: 1, desc: "理解异文化的习俗、信仰与社会结构，看懂一个群体为什么这样做。与考古学的区别：人类学看活人的社会，考古学看留下的遗迹。" },
    { id: "appraise", label: "估价", group: "knowledge", base: 5, desc: "判断一件东西的价值、品质、年代与真伪。" },
    { id: "archaeology", label: "考古学", group: "knowledge", base: 1, desc: "解读遗址、出土物与遗迹，判断年代与来历。" },
    { id: "history", label: "历史", group: "knowledge", base: 5, desc: "回忆某个地点、人物或事件的意义。与图书馆使用的分工：图书馆负责找到资料，历史负责读懂资料。" },
    { id: "law", label: "法律", group: "knowledge", base: 5, desc: "了解法律程序、先例与自身权利，知道什么会被追究、怎么周旋。换成不熟悉的司法辖区，难度通常会提高。" },
    { id: "natural_world", label: "博物学", group: "knowledge", base: 10, desc: "辨认常见的动物、植物、天气与地形，判断自然界里什么算「不对劲」。" },
    { id: "occult", label: "神秘学", group: "knowledge", base: 5, desc: "识别神秘学符号、传说与仪式说法 —— 属于人类自己的玄学传统。它与克苏鲁神话是两回事：神秘学是「人们相信什么」，神话是「实际上是什么」。" },
    { id: "language_own", label: "母语", group: "knowledge", base: "EDU", desc: "你的母语读写与表达能力，初始值等于教育。" },
    { id: "language_other", label: "外语", group: "knowledge", base: 1, desc: "某一门具体外语的读写与听说能力。每种语言单独计算、单独加点。" },
    { id: "cthulhu_mythos", label: "克苏鲁神话", group: "knowledge", base: 0, special: true, desc: "对宇宙真相的了解程度。初始为 0，不能通过教育或兴趣点提升，也永远不会获得成长标记 —— 只能靠遭遇与研读神话典籍获得。每提升 1 点，理智上限永久下降 1 点。" },
    // —— 技术 ——
    { id: "computer_use", label: "计算机使用", group: "tech", base: 5, desc: "编程、检索数据、恢复被删除的文件、破解受保护的系统或发现别人留下的木马。在 1920 年代的背景里基本派不上用场。" },
    { id: "electrical_repair", label: "电气维修", group: "tech", base: 10, desc: "修理与理解电气系统：线路、发电机、马达。" },
    { id: "electronics", label: "电子学", group: "tech", base: 1, desc: "设计、改装与破解电子装置，包括警报器、监听设备与通讯器材。" },
    { id: "mechanical_repair", label: "机械维修", group: "tech", base: 10, desc: "修理与理解机械装置：发动机、车辆、卡住的机关。" },
    { id: "operate_heavy", label: "操作重型机械", group: "tech", base: 1, desc: "安全地操作起重机、推土机这类大型设备。" },
    { id: "art_craft", label: "技艺", group: "tech", base: 5, desc: "一门手艺或艺术专长（摄影、绘画、木工、伪造…）。分配点数时需要指定具体门类。" },
    { id: "science", label: "科学", group: "tech", base: 1, desc: "某一门具体学科的知识（生物、化学、地质、天文…）。分配点数时需要指定具体学科。" },
    // —— 通用 ——
    { id: "credit_rating", label: "信用评级", group: "general", base: 0, desc: "社会地位与经济实力的第二印象：能住什么房、进什么场合、被怎么对待，也能替代外貌用于判断第一印象。每个职业都有规定区间，车卡时须落在区间内。它永远不会获得成长标记 —— 一开始就要定好。" },
    { id: "drive_auto", label: "汽车驾驶", group: "general", base: 20, desc: "在压力下驾驶汽车：追逐、逃逸、赶路。移动往往就是调查本身，所以它比看上去重要。" },
    { id: "pilot", label: "驾驶（其他）", group: "general", base: 1, desc: "驾驶某一类具体交通工具（船只、飞行器等）。每次着陆都需要检定，天气再好也不例外。" },
    { id: "disguise", label: "乔装", group: "general", base: 5, desc: "改变外貌与气质，使他人难以辨识你的身份，或误认为他人。它可助你进入某些场合，但无法解释你的来历与说辞。" },
    { id: "sleight_of_hand", label: "妙手", group: "general", base: 10, desc: "不引人注意地取放、调换或藏起小物件，也包括扒窃。" },
    { id: "survival", label: "生存", group: "general", base: 10, desc: "在某一类具体环境（荒野、沙漠、极地）中觅食、辨路、搭庇护所。分配点数时需指定环境。" },
    { id: "hypnotism", label: "催眠", group: "general", base: 1, desc: "诱导他人进入催眠状态，可用于帮助回忆或缓解症状。" },
    { id: "read_lips", label: "读唇", group: "general", base: 1, desc: "在听不到声音的情况下，通过唇形判断对方说了什么。" },
    { id: "animal_handling", label: "驯兽", group: "general", base: 5, desc: "安抚、训练与驾驭动物。" }
  ];

      return 0;
    }
  }

  function autoAllocateSkills(character, chars, occupationId) {
    const occ = OCCUPATION_MAP.get(occupationId);
    const skills2 = character.skills ?? {};
    const pts = computeSkillPoints(chars, occupationId);
    let usedOcc = 0;
    let usedInt = 0;
    for (const s of Object.values(skills2)) {
      usedOcc += Number(s.occupation) || 0;
      usedInt += Number(s.interest) || 0;
    }
    let remainOcc = Math.max(0, pts.occupationPoints - usedOcc);
    const remainInt = Math.max(0, pts.interestPoints - usedInt);
    const result = {
      ok: true,
      message: "",
      occupationAdded: 0,
      interestAdded: 0,
      creditAdded: 0,
      freePicks: [],
      remaining: { occupation: 0, interest: 0 }
    };
    if (!remainOcc && !remainInt) {
      return { ...result, ok: false, message: "已没有剩余点数可分配" };
    }
    if (!occ) {
      return { ...result, ok: false, message: "请先选择职业，否则无从判断本职技能" };
    }
    const eligible = (id) => Boolean(skills2[id]) && !skills2[id].special;
    const isRec = (id) => Boolean(skills2[id]?.recommended);
    const highBase = (id) => (Number(skills2[id]?.base) || 0) >= 50;
    const credit = skills2.credit_rating;
    const [creditLo] = occ.credit;
    if (credit && remainOcc > 0) {
      const need = Math.max(0, creditLo - skillTotalOf(credit));
      if (need > 0) {
        const give = Math.min(need, remainOcc);
        credit.occupation = (Number(credit.occupation) || 0) + give;
        remainOcc -= give;
        result.creditAdded = give;
      }
    }
    const coreIds = (occ.coreSkills ?? []).filter((id) => id !== "credit_rating" && eligible(id));
    const strong = coreIds.filter((id) => isRec(id) && !highBase(id));
    const plain = coreIds.filter((id) => !isRec(id) && !highBase(id));
    const weak = coreIds.filter(highBase);
    const freeSlots = Math.max(0, Number(occ.freeChoices) || 0);
    const freePicks = freeSlots ? Object.values(skills2).filter((s) => isRec(s.id) && !coreIds.includes(s.id) && !highBase(s.id)).sort((a, b) => String(a.label).localeCompare(String(b.label), "zh")).slice(0, freeSlots).map((s) => s.id) : [];
    result.freePicks = freePicks;
    const groups = [];
    if (strong.length) groups.push({ ids: strong, weight: 0.6 });
    if (plain.length) groups.push({ ids: plain, weight: 0.4 });
    if (freePicks.length) groups.push({ ids: freePicks, weight: 0.3 });
    if (weak.length) groups.push({ ids: weak, weight: 0.1 });
    const distribute = (groupsList, pool, kind) => {
      const hasRoom = (g) => g.ids.some((id) => skills2[id] && skillTotalOf(skills2[id]) < 99);
      let left = pool;
      let guard = 0;
      while (left > 0 && guard < 200) {
        guard += 1;
        const open = groupsList.filter(hasRoom);
        if (!open.length) break;
        const shares = splitByWeight(open, left);
        let moved = 0;
        open.forEach((g, i) => {
          const rest = spreadEvenly(skills2, g.ids, shares[i], kind);
          moved += shares[i] - rest;
        });
        if (!moved) break;
        left -= moved;
      }
      return left;
    };
    if (groups.length && remainOcc > 0) {
      const leftOver = distribute(groups, remainOcc, "occupation");
      result.occupationAdded = remainOcc - leftOver;
      result.remaining.occupation = leftOver;
    } else {
      result.remaining.occupation = remainOcc;
    }
    let intIds = Object.values(skills2).filter((s) => s.recommended && !s.special && !coreIds.includes(s.id) && !highBase(s.id)).map((s) => s.id);
    if (!intIds.length) {
      intIds = Object.values(skills2).filter((s) => s.recommended && !s.special && !highBase(s.id)).map((s) => s.id);
    }
    if (intIds.length && remainInt > 0) {
      const left = distribute([{ ids: intIds, weight: 1 }], remainInt, "interest");
      result.interestAdded = remainInt - left;
      result.remaining.interest = left;
    } else {
      result.remaining.interest = remainInt;
    }
    const parts = [];
    if (result.creditAdded) parts.push(`信用评级 +${result.creditAdded}`);
    if (result.occupationAdded) parts.push(`职业点 ${result.occupationAdded}`);
    if (result.interestAdded) parts.push(`兴趣点 ${result.interestAdded}`);
    if (freePicks.length) {
      parts.push(`${freePicks.length} 项自选：${freePicks.map((id) => skills2[id].label).join("、")}`);
    }
    const stuck = result.remaining.occupation + result.remaining.interest;
    if (stuck > 0) {
      parts.push(coreIds.length ? `${stuck} 点无处可投（可选技能都已到 99 上限）` : `${stuck} 点无处可投（该职业没有定义本职技能，请手动选择）`);
    }

    return result;
  }

  function updateBudgets(container, rulepack, character) {
    const points = rulepack.creation.computeSkillPoints(character.characteristics, character.meta?.occupationId);
    let usedOcc = 0;
    let usedInt = 0;
    for (const s of Object.values(character.skills ?? {})) {
      usedOcc += num(s.occupation);
      usedInt += num(s.interest);
    }
    const set = (selector, text, tone) => {
      const node = container.querySelector(selector);
      if (!node) return;
      node.textContent = text;
      node.style.color = tone ?? "";
    };
    const paintBudget = (kind, used, limit) => {
      const remain = limit - used;
      set(`[data-remain-value="${kind}"]`, String(remain), remain < 0 ? "var(--danger)" : "");
      set(`[data-used="${kind}"]`, String(used), used > limit ? "var(--danger)" : "");
      set(`[data-limit="${kind}"]`, String(limit));
      container.querySelector(`[data-remain-value="${kind}"]`)?.closest(".budget-card")?.classList.toggle("is-over", remain < 0);
    };
    paintBudget("occupation", usedOcc, points.occupationPoints);
    paintBudget("interest", usedInt, points.interestPoints);
    const occ = rulepack.datasets?.occupationsById?.get(character.meta?.occupationId);
    const credit = character.skills?.credit_rating;
    if (occ && credit) {
      const total = num(credit.base) + num(credit.occupation) + num(credit.interest) + num(credit.growth);
      const [lo, hi] = occ.credit;
      const ok = total >= lo && total <= hi;
      set("[data-credit-value]", String(total), ok ? "" : "var(--danger)");
      container.querySelector("[data-credit-value]")?.closest(".budget-card")?.classList.toggle("is-over", !ok);
      const rangeNode = container.querySelector("[data-credit-range]");
      if (rangeNode) rangeNode.textContent = `须在 ${lo}–${hi}${ok ? "" : " · 不达标"}`;
    }
    const problems = container.querySelector("#skill-problems");
    if (problems) {
      const errors = [];
      if (usedOcc > points.occupationPoints) errors.push(`职业技能点超支 ${usedOcc - points.occupationPoints} 点`);
      if (usedInt > points.interestPoints) errors.push(`兴趣技能点超支 ${usedInt - points.interestPoints} 点`);
      const overLimit = Object.values(character.skills ?? {}).map((s) => ({
        label: s.label,
        total: num(s.base) + num(s.occupation) + num(s.interest) + num(s.growth)
      })).filter((s) => s.total > 99);
      problems.innerHTML = [
        errors.length ? notice(errors.map(esc).join("<br>"), "danger") : "",
        overLimit.length ? notice(`${overLimit.map((s) => esc(`${s.label} 的技能值达到 ${s.total}`)).join("；")}，超过 99 上限。这不影响继续，但开跑前应确认。`, "warn") : ""
      ].join("");
    }
  }

  function rangePct(value, min, max) {
    const lo = num(min);
    const hi = num(max);
    if (hi <= lo) return 0;
    return Math.max(0, Math.min(100, (num(value) - lo) / (hi - lo) * 100));
  }
  var BAR_BANDS = { LOW: 100 / 3, MID: 200 / 3 };
  function threatFor({ pct, healthLike = false, majorWound = false }) {
    if (!healthLike) return "";
    const p = num(pct);
    if (p < BAR_BANDS.LOW) return "critical";
    if (p < BAR_BANDS.MID) return "high";
    return majorWound ? "high" : "ok";
  }
  function rangeBarAttrs({ id, value, min = 0, max, threat = "", neutral = false, label }) {

    const band = threat || (neutral ? "neutral" : "");
    return `data-range="${esc(id)}" min="${lo}" max="${hi}" value="${v}" style="--pct:${rangePct(v, lo, hi).toFixed(1)}%" aria-label="${esc(label)}"${band ? ` data-threat="${esc(band)}"` : ""}`;
  }

  var chaseView = {
    id: "chase",
    label: "追逐轮",
    group: "跑团",
    icon: ICONS.combat,
    available: (rulepack) => Boolean(rulepack?.chase),
    /**
     * ⚠️ `render` **必须是同步的** —— 别改成 `async`。
     *
     * 踩过的坑：一开始这里写成 `async`（为了先 `await` 读角色卡数据再渲染），
     * 结果 `render` 返回的是 Promise 而不是清理函数，于是：
     *   · 清理函数登记不上 → 每次切走再切回都多留一份事件监听；
     *   · 更糟的是过时的渲染会在 `await` 之后才重绘，把**已经切过去的新视图**盖掉。
     * 症状是「点一次按钮处理两遍」以及「切页之后内容串了」，都不报错，极难定位。
     *
     * 正确做法是这里这样：**先同步渲染**（用缓存里已有的数据），
     * 再把缺失的数据在后台补齐，补好了有条件地重绘一次。
     */
    render(container, ctx) {
      const { rulepack } = ctx;
      rulepackRef = rulepack;
      let disposed = false;
      const paint2 = () => {
        container.innerHTML = buildHtml2(rulepack);
      };
      const primeAndRepaint = () => {
        const missing = state3.participants.some((p) => p.characterId && !characterCache2.has(p.characterId));
        if (!missing) return;
        primeCharacterCache2(state3.participants).then(() => {
          if (disposed) return;
          paint2();
        });
      };
      const C = rulepack.chase;
      const rng = () => createRng(newSeed());
      const note = (text, tone = "ok") => {
        state3.log = [...state3.log ?? [], { at: Date.now(), round: state3.round, text, tone }].slice(-40);
      };
      const refreshActions = () => {
        const slow = slowestMov();
        const next = {};
        for (const p of state3.participants) next[p.id] = C.movementActions(p.mov, slow);
        state3.actions = next;
      };
      const onClick = async (event) => {
        const target = event.target;
        if (!(target instanceof HTMLElement)) return;
        const btn = target.closest("[data-chase-action]");
        if (!btn) return;
        const action = btn.dataset.chaseAction;
        const get = (key) => container.querySelector(`[data-add="${key}"]`)?.value ?? "";
        if (action === "add-from-archive") {
          const id = get("archive");
          if (!id) {
            toast("请先选择一名调查员", "bad");
            return;
          }
          const data = await backend.load(id);
          if (!data) {
            toast("读取角色失败", "bad");
            return;
          }
          if (state3.participants.some((p) => p.characterId === id)) {
            toast("这名调查员已经在这场追逐里了", "bad");
            return;
          }
          characterCache2.set(id, data);
          const con = num(data.characteristics?.CON) || 50;
          const drive = totalSkill(data, "drive_auto");
          state3.participants.push({
            id: uid3("p"),
            characterId: id,
            name: data.name || "未命名调查员",
            side: get("archive-side") === "pursue" ? "pursue" : "flee",
            mode: "foot",
            vehicleId: "model_t",
            dex: num(data.characteristics?.DEX) || 50,
            baseMov: num(data.derived?.mov) || 8,
            mov: num(data.derived?.mov) || 8,
            speedDelta: null,
            conValue: con,
            driveValue: drive,
            note: data.meta?.occupation || ""
          });
          save2();
          paint2();
          toast(`已引入 ${data.name || "调查员"}`);
          return;
        }
        if (action === "add-manual") {
          const name = String(get("name")).trim();
          if (!name) {
            toast("请填写名称", "bad");
            return;
          }
          const mode = get("mode") === "vehicle" ? "vehicle" : "foot";
          const vehicleId = get("vehicleId") || "model_t";
          const vehicle = C.VEHICLE_MAP.get(vehicleId);
          const movInput = num(get("mov"), 0);
          const baseMov = movInput > 0 ? movInput : mode === "vehicle" ? num(vehicle?.mov) || 11 : 8;
          state3.participants.push({
            id: uid3("p"),
            characterId: null,
            name,
            side: get("side") === "pursue" ? "pursue" : "flee",
            mode,
            vehicleId,
            build: mode === "vehicle" ? num(vehicle?.build) : null,
            dex: Math.max(1, num(get("dex"), 50)),
            baseMov,
            mov: baseMov,
            speedDelta: null,
            conValue: 50,
            driveValue: 20,
            note: ""
          });
          save2();
          paint2();
          toast(`已添加 ${name}`);
          return;
        }
        if (action === "remove-participant") {
          const id = btn.dataset.id;
          state3.participants = state3.participants.filter((p) => p.id !== id);
          delete state3.positions[id];
          delete state3.actions[id];
          save2();
          paint2();
          return;
        }
        if (action === "speed-all") {
          const r = rng();
          const day = num(getState().character?.extra?.currentDay, 1);
          for (const p of state3.participants) {
            const isVehicle = p.mode === "vehicle";
            const value = isVehicle ? p.driveValue || 20 : p.conValue || 50;
            const out = C.speedCheck({ value, rng: r, kind: isVehicle ? "skill" : "characteristic" });
            p.speedDelta = out.delta;
            p.mov = C.adjustedMov(p.baseMov, out.delta);
            note(`${p.name} 速度检定：${out.result.outcomeLabel} → ${out.label}`);
            const ch = p.characterId ? getState().character : null;
            if (ch && ch.id === p.characterId) {
              recordRoll(ch, {
                kind: isVehicle ? "skill" : "characteristic",
                label: `速度检定 · ${p.name}`,
                input: { targetValue: value, difficulty: "regular", kind: isVehicle ? "skill" : "characteristic" },
                seed: r.seed ?? "",
                result: out.result,
                day
              });
            }
          }
          save2();
          paint2();
          toast("已为全体掷速度检定");
          return;
        }
        if (action === "speed-clear") {
          for (const p of state3.participants) {
            p.speedDelta = null;
            p.mov = p.baseMov;
          }
          save2();
          paint2();
          return;
        }
        if (action === "establish") {
          const list = state3.participants.map((p) => ({ id: p.id, name: p.name, mov: p.mov, side: p.side }));
          const result = C.establishChase(list);
          if (!result.established) {
            openModal("追逐不成立", `<p>${esc(result.reason)}</p>`);
            return;
          }
          state3.positions = { ...result.positions };
          state3.started = true;
          state3.round = 1;
          state3.turnIndex = 0;
          state3.lastOutcome = null;
          refreshActions();
          note(result.reason);
          save2();
          paint2();
          toast("追逐开始");
          return;
        }
        if (action === "reset") {
          resetChaseState({ keepParticipants: true });
          paint2();
          toast("已重开追逐（参与者保留）");
          return;
        }
        if (action === "focus-turn") {
          const ordered = sortByDex2(state3.participants);
          const i = ordered.findIndex((p) => p.id === btn.dataset.id);
          if (i >= 0) {
            state3.turnIndex = i;
            save2();
            paint2();
          }
          return;
        }
        if (action === "prev-turn") {
          const n = state3.participants.length || 1;
          state3.turnIndex = (state3.turnIndex - 1 + n) % n;
          save2();
          paint2();
          return;
        }
        if (action === "next-turn") {
          advanceTurn();
          save2();
          paint2();
          return;
        }
        if (action === "next-round") {
          state3.round += 1;
          state3.turnIndex = 0;
          refreshActions();
          state3.lastOutcome = C.judgeChaseEnd(state3.participants, state3.positions);
          if (state3.lastOutcome.over) note(state3.lastOutcome.detail, "warn");
          save2();
          paint2();
          return;
        }
        if (action === "skip") {
          const p = state3.participants.find((x) => x.id === btn.dataset.id);
          if (p) state3.actions[p.id] = 0;
          advanceTurn();
          save2();
          paint2();
          return;
        }
        if (action === "move") {
          const p = state3.participants.find((x) => x.id === btn.dataset.id);
          if (!p) return;
          if (actionsLeftOf(p) <= 0) {
            toast("没有剩余移动动作了", "bad");
            return;
          }
          state3.positions[p.id] = num(state3.positions[p.id]) + 1;
          state3.actions[p.id] = actionsLeftOf(p) - 1;
          ensureLocation(state3.positions[p.id], C, rng());
          note(`${p.name} 前移到第 ${state3.positions[p.id] + 1} 个地点`);
          checkEnd();
          save2();
          paint2();
          return;
        }
        if (action === "pedal") {
          const p = state3.participants.find((x) => x.id === btn.dataset.id);
          if (!p) return;
          openModal("踩油门", `
          <p>车辆可以在一个移动动作内前移多个地点，代价是危害检定要吃惩罚骰。</p>
          <div class="row mt-4">
            <label class="field"><span class="field-label">前移几个地点</span>
              <input type="number" data-pedal="n" value="2" min="2" max="5"></label>
            <button type="button" class="btn btn-primary" data-chase-action="pedal-go" data-id="${esc(p.id)}">确定</button>
          </div>
          <p class="field-help mt-3">2–3 个地点 → 危害 +1 惩罚骰；4–5 个地点 → +2 惩罚骰。</p>
        `);
          return;
        }
        if (action === "pedal-go") {
          const p = state3.participants.find((x) => x.id === btn.dataset.id);
          const n = Math.max(2, Math.min(5, num(document.querySelector('[data-pedal="n"]')?.value, 2)));
          if (!p) return;
          if (actionsLeftOf(p) <= 0) {
            toast("没有剩余移动动作了", "bad");
            return;
          }
          const plan = C.pedalToMetal(n);
          state3.positions[p.id] = num(state3.positions[p.id]) + plan.locations;
          state3.actions[p.id] = actionsLeftOf(p) - 1;

      const onClick = async (event) => {
        const target = event.target;

        const openBtn = target.closest("[data-open]");
        if (openBtn) {
          await openCharacter(openBtn.dataset.open);
          navigate2("sheet");
          return;
        }
        const btn = target.closest("[data-action]");

        if (btn.dataset.action === "clear-combat") {

        if (target.closest("button, a, input, select, textarea, label")) return;
        const row = target.closest("[data-row-action], [data-open-current]");
        if (!row) return;
        const view = row.hasAttribute("data-open-current") ? "sheet" : ACTION_VIEWS[row.dataset.rowAction];
        if (view) navigate2(view);

        const target = event.target;

        const details = container.querySelector("[data-guide]");

        guideOpen = details.open;

      const onModalClick = (event) => {

          paint2();
          return;
        }
        if (target.closest("[data-cancel]")) closeModal();
      };
      const modalBody = document.getElementById("modal-body");
      modalBody?.addEventListener("click", onModalClick);
      container.addEventListener("click", onClick);
      container.addEventListener("toggle", onToggle, true);
      return () => {
        container.removeEventListener("click", onClick);
        container.removeEventListener("click", onClickRow);
        container.removeEventListener("toggle", onToggle, true);
        modalBody?.removeEventListener("click", onModalClick);
      };
    }

  function radarSvg(axes, options = {}) {
    const { max = 100, size = 240, baseline = 0.5 } = options;
    const n = axes.length;
    if (n < 3) return "";
    const c = size / 2;
    const R = size * 0.305;
    const labelR = R * 1.26;
    const at = (i, r) => {
      const a = -Math.PI / 2 + i * 2 * Math.PI / n;
      return [c + r * Math.cos(a), c + r * Math.sin(a)];
    };
    const ringPoints = (r) => axes.map((_, i) => at(i, r).map((v) => v.toFixed(1)).join(",")).join(" ");
    const valueRadius = (v) => {
      const ratio = (Number(v) || 0) / max;
      return Math.max(0, Math.min(1, ratio)) * R;
    };
    const rings = [0.25, 0.5, 0.75, 1].map((f) => `<polygon points="${ringPoints(R * f)}" fill="none"
      stroke="rgba(169,166,161,${f === baseline ? ".34" : ".16"})"
      stroke-width="${f === baseline ? 1 : 0.5}"/>`).join("");
    const spokes = axes.map((_, i) => {
      const [x, y] = at(i, R);
      return `<line x1="${c}" y1="${c}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`;
    }).join("");
    const valuePoints = axes.map((axis, i) => at(i, valueRadius(axis.value)).map((v) => v.toFixed(1)).join(",")).join(" ");
    const dots = axes.map((axis, i) => {
      const [x, y] = at(i, valueRadius(axis.value));
      return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2"/>`;
    }).join("");
    const labels = axes.map((axis, i) => {
      const [x, y] = at(i, labelR);
      const anchor = Math.abs(x - c) < 1 ? "middle" : x > c ? "start" : "end";
      return `<text x="${x.toFixed(1)}" y="${(y + 4).toFixed(1)}" text-anchor="${anchor}">${esc(axis.label)}</text>`;
    }).join("");
    const summary = axes.map((a) => `${a.label} ${Number(a.value) || 0}`).join("、");
    return `<svg class="radar" viewBox="0 0 ${size} ${size}" role="img" aria-label="属性雷达图">
    <title>属性雷达图</title>
    <desc>八项属性：${esc(summary)}。灰环 50 为普通成年人基准。</desc>
    ${rings}
    <g stroke="rgba(169,166,161,.14)" stroke-width="0.5">${spokes}</g>

    <g fill="#9cc9ae">${dots}</g>
    <g fill="#a9a6a1" font-size="11">${labels}</g>
  </svg>`;
  }

  function luckBlockHtml(rulepack, character, entry, options) {

      kind: entry.input?.kind ?? "skill",
      successLevel: entry.result.successLevel,
      options
    });
    if (entry.luckSpent) {
      return `
      <div class="roll-note lv-extreme">

      </div>`;
    }

  function rollButtonText(panel2, rulepack) {
    if (panel2.mode === "opposed") return "双方各掷一次";
    const diff = DIFFICULTIES.find((d) => d.id === panel2.difficulty);
    const bits = [diff?.short ?? diff?.label ?? panel2.difficulty];
    if (num(panel2.bonus)) bits.push(`奖励骰 ${num(panel2.bonus)}`);
    if (num(panel2.penalty)) bits.push(`惩罚骰 ${num(panel2.penalty)}`);
    if (num(panel2.modifier)) bits.push(`修正 ${num(panel2.modifier) > 0 ? "+" : ""}${num(panel2.modifier)}`);
    if (panel2.mode === "combined") bits.push("联合");
    if (panel2.kind === "sanity") return `掷骰（${bits.join(" · ")}）`;
    const target = rulepack.adjustTarget(num(panel2.value) + num(panel2.modifier), panel2.difficulty);
    return `掷骰（${bits.join(" · ")} · 目标 ${num(target)}）`;

    const name = String(ch.name || "").trim() || "未命名调查员";
    host.innerHTML = `<button type="button" class="char-chip" data-topbar-character
    title="当前调查员：${esc(name)}（点击回到角色卡）">
      <span class="char-chip-name">${esc(name)}</span>
      <span class="char-chip-stats mono">HP ${num(hp.current)}/${num(hp.max)} · SAN ${num(san.current)}/${num(san.max)}</span>
    </button>`;
  }
  function renderSaveStatus() {
    const host = document.getElementById("topbar-save");
    if (!host) return;
    const s = getSaveState();
    if (s.mode === "memory") {
      host.innerHTML = `<button type="button" class="save-chip is-bad" data-save-detail
      title="浏览器未提供本地存储，数据只保留在本次打开的页面中">仅内存模式 · 关闭即丢失</button>`;
      return;
    }
    if (s.status === "error") {
      const failed = getFailedWrites();
      const who = failed.map((f) => f.label).join("、");
      const title = failed.length ? `${who}未保存：${s.error || "写入失败"}` : s.error || "写入失败";
      host.innerHTML = `<button type="button" class="save-chip is-bad" data-save-detail
      title="${esc(title)}">${failed.length ? `未保存 ${failed.length} 项 · 点此处理` : "保存失败 · 点此处理"}</button>`;
      return;
    }
    if (s.status === "saving") {
      host.innerHTML = '<span class="save-chip is-busy">保存中…</span>';
      return;
    }
    if (s.status === "saved") {
      const at = s.at ? new Date(s.at).toLocaleTimeString("zh-CN", { hour12: false }) : "";
      host.innerHTML = `<span class="save-chip">已保存${at ? ` · ${esc(at)}` : ""}</span>`;
      return;
    }
    host.innerHTML = "";
  }
  var saveDetailCleanup = null;
  function showSaveDetail() {
    const s = getSaveState();
    const memory = s.mode === "memory";
    const failed = getFailedWrites();
    const failedList = failed.length ? `<ul class="mt-3">${failed.map((f) => `<li><b>${esc(f.label)}</b>：${esc(f.error)}</li>`).join("")}</ul>` : "";
    openModal(memory ? "数据只保存在这个页面里" : "保存失败", `
    <p>${memory ? "浏览器没有提供本地存储（可能处于隐私模式，或站点数据被策略禁用）。功能可以照常使用，但<b>关闭或刷新页面后，本次的记录都会丢失</b>。建议先导出一份工作副本。" : `写入本地存储时出错：<b>${esc(s.error || "未知原因")}</b>。改动仍保留在内存里，可重试保存，或先导出一份副本留底。`}</p>
    ${failedList}
    <div class="btn-row mt-4">
      ${memory ? "" : '<button type="button" class="btn btn-primary" data-save-retry>重试保存</button>'}
      <button type="button" class="btn" data-save-export>导出工作副本</button>
      <button type="button" class="btn btn-ghost" data-cancel>关闭</button>
    </div>
  `);
    const body = document.getElementById("modal-body");
    const onClick = async (event) => {
      const target = event.target;
      if (!(target instanceof HTMLElement)) return;
      if (target.closest("[data-save-retry]")) {
        await retrySave();
        const ok = getSaveState().status === "saved";
        const stillFailed = getFailedWrites();
        closeModal();
        toast(
          ok ? "已重新保存" : stillFailed.length ? `仍有未保存：${stillFailed.map((f) => f.label).join("、")} —— 请导出副本留底` : "仍然失败，请导出副本留底",
          ok ? "ok" : "bad",
          4200
        );
        return;
      }
      if (target.closest("[data-save-export]")) {
        const pending = getFailedWrites();
        const ch = getState().character;
        if (pending.length) {
          downloadJSON("未保存的工作副本.json", { failedAt: (/* @__PURE__ */ new Date()).toISOString(), character: ch ?? null, pending });
        } else if (ch) {
          downloadJSON(`${safeFilename(ch.name)}.json`, ch);
        }
        return;
      }
      if (target.closest("[data-cancel]")) closeModal();
    };
    saveDetailCleanup?.();
    body?.addEventListener("click", onClick);
    saveDetailCleanup = () => body?.removeEventListener("click", onClick);
  }
  onModalClosed(() => {
    saveDetailCleanup?.();
    saveDetailCleanup = null;
    if (consumeCharacterDirty()) paint();
  });
  function showLegal() {
    const m = currentRulepack().manifest;
    openModal("声明与授权", `
    <h3>${esc(m.name)} · ${esc(m.version)}</h3>
    <p>${esc(m.note ?? "")}</p>

    <h3>授权来源</h3>
    <p>${esc(m.license)}</p>

    <h3>版权声明（原文，须随内容一并保留）</h3>
    <div class="legal-text">${esc(m.attribution)}</div>
    ${m.attributionZh ? `<h3>中文说明</h3><p>${esc(m.attributionZh)}</p>` : ""}

    <h3>关于本工具</h3>
    <p>本项目是一个个人自用的跑团辅助工具，数据保存在本机浏览器中，不上传任何服务器，也不收取任何费用。</p>
    <p class="mt-3">如果不打算对外分发，这份声明依然值得保留 —— 它既是授权方的明确要求，也能让后来使用这张卡的人知道数值从哪来。</p>
  `);
  }
  async function switchRulepack(id) {
    const previous = getState().rulepackId;
    if (previous === id) return;
    setState({ rulepackId: id });
    setDefaultRulepack(id);
    await setPref("rulepack", id);
    await loadHouseRules(currentRulepack()).catch(() => {
    });
    const character = getState().character;
    if (!character || character.rulepackId !== id) {
      setState({ character: null });
      const remembered = await getPref(`lastCharacter:${id}`, null);
      const inArchive = (cid) => cid && getState().archive.some((a) => a.id === cid);
      const target = inArchive(remembered) ? remembered : getState().archive.find((a) => a.rulepackId === id)?.id;
      if (target) await openCharacter(target);
    }
    const rulepack = currentRulepack();
    if (!isViewAvailable(getView(getState().view), rulepack)) {
      setState({ view: firstAvailableView(rulepack) });
    }
    paint();
    toast(`已切换到「${rulepack.manifest.name}」`);
  }
  function announceRestoredCharacter() {
    const restoredChar = getState().character;
    if (!restoredChar) return false;
    toast(`已恢复上次打开的角色卡：${restoredChar.name || "未命名调查员"}`, "info", 4200);
    return true;
  }
  async function boot() {
    initTheme();
    registerRulepack(coc7);
    registerRulepack(dnd5e);
    for (const view of ALL_VIEWS) registerView(view);
    const select = document.getElementById("rulepack-select");
    const { usable } = renderRulepackOptions(select);
    if (select) select.addEventListener("change", () => switchRulepack(select.value));
    const savedPack = await getPref("rulepack", null);
    const initialPack = pickInitialRulepack(savedPack, usable);
    setState({ rulepackId: initialPack });
    setDefaultRulepack(initialPack);
    if (select) select.value = initialPack;
    await loadHouseRules(currentRulepack()).catch(() => {
    });
    document.getElementById("btn-legal")?.addEventListener("click", showLegal);
    document.getElementById("modal-close")?.addEventListener("click", closeModal);
    onSaveStateChange(renderTopbar);
    document.getElementById("topbar-save")?.addEventListener("click", (event) => {
      const target = event.target;
      if (target instanceof HTMLElement && target.closest("[data-save-detail]")) showSaveDetail();
    });
    document.getElementById("topbar-character")?.addEventListener("click", (event) => {
      const target = event.target;
      if (target instanceof HTMLElement && target.closest("[data-topbar-character]")) navigate("sheet");
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeModal();
    });
    initTooltip();
    const printState = [];
    window.addEventListener("beforeprint", () => {
      printState.length = 0;
      for (const d of document.querySelectorAll("details")) {
        printState.push([d, d.open]);
        d.open = true;
      }
    });
    window.addEventListener("afterprint", () => {
      for (const [d, open] of printState) d.open = open;
      printState.length = 0;
    });
    await reconcileArchive().catch(() => {
    });
    await refreshArchive().catch(() => {
    });
    await restoreLastCharacter().catch(() => {
    });
    announceRestoredCharacter();
    const character = getState().character;
    if (character && character.rulepackId !== initialPack) setState({ character: null });
    const rulepack = currentRulepack();
    const savedView = await getPref("lastView", null);
    const viewId = isViewAvailable(getView(savedView), rulepack) ? savedView : firstAvailableView(rulepack);
    setState({ view: viewId ?? "wizard" });
    paint();
  }
  boot().catch((err) => {
    console.error(err);
    const viewport = document.getElementById("viewport");
    if (viewport) {
      viewport.innerHTML = `<div class="notice notice-danger">应用启动失败：${esc(err.message)}</div>`;
    }
  });
})();

</script>

<script>
// 兜底：直接双击打开（file:// 协议）时，浏览器会拒绝加载上面的 ES Module，
// 结果是一个「有外壳、没内容」的空白页面。这里负责把原因说出来。
// 这段是普通脚本，不受模块的跨源限制，所以一定能跑。
(function () {
  window.addEventListener('load', function () {
    setTimeout(function () {
      var sidebar = document.getElementById('sidebar');
      var viewport = document.getElementById('viewport');
      if (!sidebar || !viewport || sidebar.children.length > 0) return;

      viewport.innerHTML =
        '<div class="notice notice-warn" style="margin:48px auto;max-width:620px;display:block">'
        + '<div>'
        + '<b style="font-size:15px">界面没有加载起来 —— 因为你是直接双击打开的。</b>'
        + '<p style="margin:12px 0 0">地址栏如果以 <code>file://</code> 开头，浏览器会以安全策略拒绝加载 '
        + 'ES Module（负责渲染界面的脚本）。这是浏览器的限制，文件本身没有问题 —— '
        + 'CSS 能加载，脚本不能，所以你会看到一个「有外壳、没内容」的页面。</p>'
        + '<p style="margin:16px 0 6px">三种启动方式，任选其一：</p>'
        + '<ul style="margin:0;padding-left:1.2em;line-height:1.9">'
        + '<li>双击目录里的 <b>start.bat</b>（会自己开浏览器，推荐）</li>'
        + '<li>命令行运行 <b>node serve.js</b>，然后访问 http://127.0.0.1:4173/</li>'
        + '<li>打开 <b>dist/investigator-tool.html</b> —— 单文件版，可以直接双击</li>'
        + '</ul>'
        + '</div></div>';
    }, 700);
  });
})();
</script>
